
name: Build Ledger APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Arrange files
        run: |
          mkdir -p www assets
          cp index.html manifest.webmanifest icon-192.png icon-512.png www/
          cp icon-only.png icon-foreground.png icon-background.png assets/

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#090B0F' --iconBackgroundColorDark '#090B0F'

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ledger-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
