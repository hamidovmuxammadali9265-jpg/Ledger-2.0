<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090B0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ledger — Life &amp; Performance OS</title>
<style>
/* ============================================================
   DESIGN TOKENS
   Ledger: an academic + athletic performance system.
   Base: cool charcoal (field-notebook-at-night), not pure black.
   Accents map to domains — track orange (physical), ink blue
   (academic), signal green (language) — so color itself carries
   meaning across the app rather than decorating it.
   Type: Fraunces (serif, personality, used for numbers & headers)
         + IBM Plex Sans (technical, for body/data/labels).
   ============================================================ */
@font-face {
  font-family: 'Fraunces';
  src: local('Fraunces');
}
:root {
  --bg: #090B0F;
  --bg-raised: #171B22;
  --bg-inset: #0d1015;
  --line: #292F38;
  --line-soft: #20252d;
  --text: #F5F7FA;
  --text-dim: #B7BFC9;
  --text-faint: #858D98;

  --track: #E10600;      /* physical / training */
  --track-dim: #5a0f0c;
  --ink: #DCE3EA;         /* academic */
  --ink-dim: #3a4350;
  --signal: #F5F7FA;      /* languages */
  --signal-dim: #4a525c;
  --amber: #A9B1BC;       /* projects / professional */
  --amber-dim: #4a525c;
  --violet: #858D98;      /* recovery / discipline */
  --violet-dim: #3a4350;

  --danger: #FF4D43;
  --good: #F5F7FA;

  --radius-s: 6px;
  --radius-m: 12px;

  --serif: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button {
  font-family: inherit;
  cursor: pointer;
}
input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: var(--text);
  background: var(--bg-inset);
  border: 1px solid var(--line);
  border-radius: var(--radius-s);
  padding: 8px 10px;
}
input:focus, select:focus, textarea:focus, button:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 1px;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- layout shell ---------- */
#app {
  display: grid;
  grid-template-columns: 232px 1fr;
  min-height: 100vh;
}
@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; }
  #sidebar { display: none; }
  #sidebar.open { display: flex; position: fixed; inset: 0; z-index: 50; width: 100%; }
}

#sidebar {
  background: var(--bg-raised);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 20px 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  padding: 0 20px 18px;
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 8px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.brand .close-btn { display: none; background: none; border: none; color: var(--text-dim); font-size: 20px; }
@media (max-width: 860px) { .brand .close-btn { display: block; } }

.nav-group { margin-top: 14px; }
.nav-label {
  padding: 0 20px 6px;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--text-faint);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 20px;
  color: var(--text-dim);
  text-decoration: none;
  border-left: 2px solid transparent;
  font-size: 14px;
  background: none;
  border-top: none; border-right: none; border-bottom: none;
  width: 100%;
  text-align: left;
}
.nav-item:hover { color: var(--text); background: var(--bg-inset); }
.nav-item.active {
  color: var(--text);
  border-left-color: var(--ink);
  background: var(--bg-inset);
}
.nav-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

.sidebar-foot {
  margin-top: auto;
  padding: 14px 20px 0;
  border-top: 1px solid var(--line-soft);
  font-size: 12px;
  color: var(--text-faint);
}

#main {
  padding: 26px 32px 80px;
  max-width: 1120px;
  width: 100%;
}
@media (max-width: 860px) {
  #main { padding: 18px 16px 90px; }
}

.topbar {
  display: none;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
@media (max-width: 860px) {
  .topbar { display: flex; }
}
.hamburger {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: var(--radius-s);
  padding: 8px 12px;
}

.page { display: none; }
.page.active { display: block; }

.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 22px;
  flex-wrap: wrap;
  gap: 10px;
}
.page-title {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 600;
  margin: 0;
}
.page-sub { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

/* ---------- primitives ---------- */
.section {
  margin-bottom: 30px;
}
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--line);
  padding-bottom: 8px;
  margin-bottom: 14px;
}
.section-title {
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 500;
}
.section-title .n { color: var(--text-faint); font-weight: 400; }

.card {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  padding: 16px;
}
.grid {
  display: grid;
  gap: 14px;
}
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 760px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

.stat {
  border-left: 2px solid var(--line);
  padding: 2px 0 2px 12px;
}
.stat.track { border-color: var(--track); }
.stat.ink { border-color: var(--ink); }
.stat.signal { border-color: var(--signal); }
.stat.amber { border-color: var(--amber); }
.stat.violet { border-color: var(--violet); }
.stat-num { font-family: var(--serif); font-size: 26px; line-height: 1.1; }
.stat-label { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--text-dim);
}
.pill.track { border-color: var(--track-dim); color: var(--track); }
.pill.ink { border-color: var(--ink-dim); color: var(--ink); }
.pill.signal { border-color: var(--signal-dim); color: var(--signal); }
.pill.amber { border-color: var(--amber-dim); color: var(--amber); }
.pill.violet { border-color: var(--violet-dim); color: var(--violet); }
.pill.danger { border-color: #6b2b2b; color: var(--danger); }

.btn {
  background: var(--bg-inset);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 8px 14px;
  border-radius: var(--radius-s);
  font-size: 13px;
}
.btn:hover { border-color: var(--text-faint); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #0b0e1a; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
.btn.small { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.field label { font-size: 12px; color: var(--text-dim); }
.field input, .field select, .field textarea { width: 100%; }

.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--line-soft);
  gap: 10px;
}
.list-item:last-child { border-bottom: none; }

.empty {
  color: var(--text-faint);
  font-size: 13px;
  padding: 18px 0;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: var(--radius-m);
}

.bar-track {
  height: 6px;
  background: var(--bg-inset);
  border-radius: 4px;
  overflow: hidden;
}
.bar-fill { height: 100%; border-radius: 4px; }

.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(10,11,13,0.72);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  padding: 22px;
  width: 100%;
  max-width: 460px;
  max-height: 86vh;
  overflow-y: auto;
}
.modal h3 { font-family: var(--serif); margin: 0 0 14px; font-size: 19px; }

.toast-wrap {
  position: fixed; bottom: 20px; right: 20px; z-index: 200;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-left: 3px solid var(--good);
  padding: 10px 14px;
  border-radius: var(--radius-s);
  font-size: 13px;
  max-width: 300px;
}
.toast.err { border-left-color: var(--danger); }

hr.hair { border: none; border-top: 1px solid var(--line-soft); margin: 14px 0; }

.mono { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
.muted { color: var(--text-dim); }
.faint { color: var(--text-faint); }
textarea { resize: vertical; min-height: 70px; }

/* ---- PHONE APP LAYER ---- */
#tabbar{display:none}
@media (max-width:860px){
  body{padding-top:env(safe-area-inset-top);-webkit-tap-highlight-color:transparent}
  #pages{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  #tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(9,11,15,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  #tabbar button{background:none;border:0;color:var(--text-faint);font-family:inherit;font-size:10.5px;font-weight:600;line-height:1;letter-spacing:.3px;
    padding:6px 0 4px;min-height:50px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;transition:color .15s}
  #tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #tabbar button.active{color:var(--text)}
  #tabbar button.active::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--track)}
  .btn{min-height:42px;white-space:nowrap}
  input,select,textarea{font-size:16px!important}
  .card{border-radius:10px}
  .topbar .hamburger{display:none}
  #sidebar{display:none}
  #sidebar.open{display:flex;position:fixed;inset:0;z-index:60;width:100%;padding-top:calc(20px + env(safe-area-inset-top))}
}
.rem-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.rem-row:last-child{border-bottom:0}
.rem-row input[type=time]{width:auto;min-width:96px}
.rem-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--track)}

.tick{width:30px;height:30px;min-width:30px;border-radius:50%;border:2px solid var(--line);background:transparent;color:#0d1015;font-size:16px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;margin-right:12px;cursor:pointer}
.tick.on{background:var(--signal);border-color:var(--signal)}
.todo-main{display:flex;align-items:center;flex:1;min-width:0}
.is-done .todo-text{text-decoration:line-through;color:var(--text-faint)}
.plan-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.plan-row strong,.plan-row .note{grid-column:1/-1}

/* ---- PREMIUM MINIMALISM: Obsidian / Ice / Racing Red ---- */
body{letter-spacing:.005em}
.page-title{font-weight:700;letter-spacing:-.03em}
.page-sub,.stat-label{color:var(--text-dim)}
.section-title{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--text-faint);font-weight:600}
.card{background:var(--bg-raised);border:1px solid var(--line);border-radius:14px;transition:border-color .2s,transform .2s}
.card:hover{border-color:#3a424d}
.stat{border-left:2px solid var(--track)}
.stat-num{font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.btn{border-radius:10px;transition:transform .12s ease,background .15s,border-color .15s}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--track);border-color:var(--track);color:#fff;font-weight:600}
.btn.primary:hover{background:#f01a0f}
.big-clock{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1;margin-bottom:10px;font-variant-numeric:tabular-nums}
.tick.on{background:var(--track);border-color:var(--track);color:#fff}
.tick.pop{animation:pop .26s ease}
@keyframes pop{50%{transform:scale(1.28)}}
.page.active{animation:fadeUp .38s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bar-fill{animation:grow .9s cubic-bezier(.2,.8,.2,1)}
@keyframes grow{from{width:0}}
.modal{animation:fadeUp .25s ease}
#tabbar button.active::before{background:var(--track);box-shadow:0 0 12px rgba(225,6,0,.6)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.act-in{width:76px;min-height:38px;text-align:center}
:focus-visible{outline:2px solid var(--track);outline-offset:2px}
.tick{position:relative}.tick::after{content:"";position:absolute;inset:-8px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.grid-3 .stat-num{font-size:20px}}

.hcard{background:var(--bg-raised);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;transition:transform .18s,border-color .2s}
.hcard:active{transform:scale(.988)}
.hhead{display:flex;align-items:center;gap:12px;margin-bottom:12px;cursor:pointer}
.hico{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.hico.big{width:48px;height:48px;font-size:24px}
.hname{flex:1;min-width:0;font-weight:600;font-size:15px}.hsub{font-size:11px;color:var(--text-faint);font-weight:400;margin-top:2px}
.hstreak{font-size:13px;font-weight:600;color:var(--text-dim);white-space:nowrap}
.tick.big{width:40px;height:40px;min-width:40px;margin:0;font-size:20px}
.hgrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;gap:3px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.hgrid::-webkit-scrollbar{display:none}
.cell{width:13px;height:13px;border-radius:4px;background:#20252d;border:0;padding:0;position:relative;transition:transform .12s,background .2s}
.cell::after{content:"";position:absolute;inset:-2px}
.cell.on{background:var(--c)}.cell.part{background:var(--c);opacity:.45}.cell.fut{opacity:.22}.cell.tdy{box-shadow:0 0 0 1.5px var(--c)}
.cell:active{transform:scale(1.5)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chip{background:var(--bg-raised);border:1px solid var(--line);color:var(--text-dim);border-radius:99px;padding:8px 16px;font:inherit;font-size:13px;white-space:nowrap;transition:all .2s}
.chip.on{background:var(--text);color:#090B0F;border-color:var(--text);font-weight:600}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;transition:transform .15s}
.swatch.sel{border-color:#fff;transform:scale(1.15)}
.mini{background:var(--bg-inset);border-radius:12px;padding:10px 4px;text-align:center}.mini b{display:block;font-size:19px}.mini span{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.08em}
.wdbars{display:flex;gap:8px;align-items:flex-end}.wdbars>div{flex:1;text-align:center}.wdbars span{font-size:10px;color:var(--text-faint)}
.wdb{height:64px;background:var(--bg-inset);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden;margin-bottom:4px}
.wdb i{display:block;width:100%;background:var(--c,#E10600);border-radius:6px 6px 0 0;animation:grow2 .8s cubic-bezier(.2,.9,.25,1) both}
@keyframes grow2{from{height:0!important}}
.bdot{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:300}
.ringc{animation:ring 1.1s cubic-bezier(.2,.9,.25,1) both}
@keyframes ring{from{stroke-dasharray:0 276.46}}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawl 1.3s cubic-bezier(.3,.7,.2,1) .2s forwards}
@keyframes drawl{to{stroke-dashoffset:0}}
#fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--track);color:#fff;font-size:32px;font-weight:300;line-height:1;border:0;box-shadow:0 10px 30px rgba(225,6,0,.5);z-index:45;transition:transform .15s;animation:pop .4s cubic-bezier(.2,.9,.25,1) both}
#fab:active{transform:scale(.88) rotate(90deg)}
@media (min-width:861px){#fab{bottom:28px}}
.page.active{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:none}}
body[data-nav] .page.active>*:nth-child(1){animation:rise .55s cubic-bezier(.2,.9,.25,1) both;animation-delay:50ms}
body[data-nav] .page.active>*:nth-child(2){animation:rise .55s cubic-bezier(.2,.9,.25,1) both;animation-delay:100ms}
body[data-nav] .page.active>*:nth-child(3){animation:rise .55s cubic-bezier(.2,.9,.25,1) both;animation-delay:150ms}
body[data-nav] .page.active>*:nth-child(4){animation:rise .55s cubic-bezier(.2,.9,.25,1) both;animation-delay:200ms}
body[data-nav] .page.active>*:nth-child(5){animation:rise .55s cubic-bezier(.2,.9,.25,1) both;animation-delay:250ms}
body[data-nav] .page.active>*:nth-child(6){animation:rise .55s cubic-bezier(.2,.9,.25,1) both;animation-delay:300ms}
body[data-nav] .page.active>*:nth-child(7){animation:rise .55s cubic-bezier(.2,.9,.25,1) both;animation-delay:350ms}
body[data-nav] .page.active>*:nth-child(8){animation:rise .55s cubic-bezier(.2,.9,.25,1) both;animation-delay:400ms}
body[data-nav] .page.active>*:nth-child(9){animation:rise .55s cubic-bezier(.2,.9,.25,1) both;animation-delay:450ms}
@media (max-width:860px){
  .modal-overlay{align-items:flex-end;padding:0}
  .modal{width:100%;max-width:none;border-radius:24px 24px 0 0;max-height:90vh;overflow:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom));animation:sheet .36s cubic-bezier(.2,.9,.25,1)}
  .modal::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-10px auto 14px}
}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="brand">Ledger <button class="close-btn" onclick="closeSidebar()">✕</button></div>
    <div class="nav-group" id="nav-list"></div>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </nav>
  <main id="main">
    <div class="topbar">
      <button class="hamburger" onclick="openSidebar()">☰ Menu</button>
      <strong id="topbar-title" style="font-family:var(--serif);font-size:18px;"></strong>
    </div>
    <div id="pages"></div>
  </main>
</div>

<script>
/* ============================================================
   LEDGER — core: constants, db layer, utilities
   ============================================================ */
const DB_NAME = 'ledger_os';
const DB_VERSION = 1;
let db = null;

const STORES = [
  { name: 'habits', keyPath: 'id' },
  { name: 'habitLogs', keyPath: 'id' },
  { name: 'runs', keyPath: 'id' },
  { name: 'strengthSessions', keyPath: 'id' },
  { name: 'courses', keyPath: 'id' },
  { name: 'assignments', keyPath: 'id' },
  { name: 'studySessions', keyPath: 'id' },
  { name: 'languageLogs', keyPath: 'id' },
  { name: 'projects', keyPath: 'id' },
  { name: 'skills', keyPath: 'id' },
  { name: 'goals', keyPath: 'id' },
  { name: 'dailyReflections', keyPath: 'id' },
  { name: 'weeklyReviews', keyPath: 'id' },
  { name: 'recoveryLogs', keyPath: 'id' },
  { name: 'meta', keyPath: 'key' }
];

function openDatabase() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const _db = e.target.result;
      STORES.forEach(s => {
        if (!_db.objectStoreNames.contains(s.name)) {
          _db.createObjectStore(s.name, { keyPath: s.keyPath });
        }
      });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error);
  });
}

function tx(storeName, mode = 'readonly') {
  return db.transaction(storeName, mode).objectStore(storeName);
}
function dbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function dbGet(storeName, key) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
function dbPut(storeName, value) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName, 'readwrite').put(value);
    req.onsuccess = () => resolve(value);
    req.onerror = () => reject(req.error);
  });
}
function dbDelete(storeName, key) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName, 'readwrite').delete(key);
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}
function dbClear(storeName) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName, 'readwrite').clear();
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function todayISO(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function nowISO() { return new Date().toISOString(); }
function dayName(iso) {
  const names = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  return names[new Date(iso + 'T12:00:00').getDay()];
}
function shortDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' +
    d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}
function daysBetween(a, b) {
  const A = new Date(a + 'T00:00:00'), B = new Date(b + 'T00:00:00');
  return Math.round((B - A) / 86400000);
}
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function round1(n) { return Math.round(n * 10) / 10; }
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg, isErr = false) {
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function openModal(html) {
  document.getElementById('modal-body').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal-body').innerHTML = '';
}
document.addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

function openSidebar() { document.getElementById('sidebar').classList.add('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }
/* ============================================================
   LEDGER — domain constants & seeding
   ============================================================ */

// suggested weekly load shape — used only to seed defaults / label days, never locks the user in
const DAY_PLAN = {
  Monday:    { training: 'gym', intensity: 'moderate', note: 'Strength session.' },
  Tuesday:   { training: 'run', intensity: 'moderate', note: 'Run day.' },
  Wednesday: { training: 'recovery', intensity: 'light', note: 'Active recovery.' },
  Thursday:  { training: 'gym', intensity: 'moderate', note: 'Strength session.' },
  Friday:    { training: 'run', intensity: 'moderate', note: 'Easy run.' },
  Saturday:  { training: 'long_run', intensity: 'hard', note: 'Long run or a longer activity.' },
  Sunday:    { training: 'rest', intensity: 'light', note: 'Rest and plan the week.' }
};

// performance weighting — default, editable in Settings
const DEFAULT_WEIGHTS = {
  academic: 30,
  physical: 25,
  languages: 15,
  professional: 15,
  recovery: 10,
  discipline: 5
};

const SKILL_TREE = {
  Academic: ['Research', 'Critical Thinking', 'Academic Writing', 'Argumentation', 'Analysis', 'Presentation'],
  Languages: ['Speaking', 'Listening', 'Reading', 'Writing'],
  Physical: ['Strength', 'Endurance', 'Mobility', 'Conditioning'],
  Professional: ['Project Management', 'Communication', 'Practical Experience', 'Portfolio']
};

const STRENGTH_SPLIT = {
  // simple upper/lower/full rotation appropriate for "some experience, no structure", 3x/week
  A: {
    label: 'Push-dominant Upper',
    exercises: ['Barbell/DB Bench Press', 'Overhead Press', 'Incline DB Press', 'Triceps Pushdown or Dips', 'Lateral Raise']
  },
  B: {
    label: 'Lower Body',
    exercises: ['Back Squat', 'Romanian Deadlift', 'Walking Lunge', 'Leg Curl or Nordic', 'Calf Raise']
  },
  C: {
    label: 'Pull-dominant Upper + Core',
    exercises: ['Weighted Pull-up or Lat Pulldown', 'Barbell/DB Row', 'Face Pull', 'Biceps Curl', 'Hanging Leg Raise']
  }
};

async function seedIfEmpty() {
  if (await dbGet('meta', 'weights')) return;

  // starter habits
  const habitDefs = [
    { name: 'Read / learn something', category: 'academic', frequency: 'daily', min: '20 min', ideal: '45 min' },
    { name: 'Move your body', category: 'physical', frequency: 'daily', min: '10 min walk', ideal: '30 min' },
    { name: 'Sleep logged', category: 'recovery', frequency: 'daily', min: 'logged', ideal: '7h+' },
    { name: 'One focused work block', category: 'academic', frequency: 'daily', min: '25 min', ideal: '60 min' },
    { name: 'Strength session', category: 'physical', frequency: 'weekly', min: '1x', ideal: '3x/week' },
    { name: 'Run', category: 'physical', frequency: 'weekly', min: '1x', ideal: '2–3x/week' },
    { name: 'Deep work / project block', category: 'professional', frequency: 'weekly', min: '1x', ideal: '1x, 60+ min' }
  ];
  for (const h of habitDefs) {
    await dbPut('habits', {
      id: uid(), name: h.name, category: h.category, frequency: h.frequency,
      target: h.ideal, minViable: h.min, idealVersion: h.ideal,
      createdAt: nowISO(), archived: false
    });
  }

  // skill tree entries
  for (const group of Object.keys(SKILL_TREE)) {
    for (const skillName of SKILL_TREE[group]) {
      await dbPut('skills', {
        id: uid(), group, name: skillName, level: 1, evidenceCount: 0,
        lastPracticed: null, milestones: []
      });
    }
  }

  // weights
  await dbPut('meta', { key: 'weights', value: DEFAULT_WEIGHTS });
}

async function getWeights() {
  const rec = await dbGet('meta', 'weights');
  return rec ? rec.value : DEFAULT_WEIGHTS;
}
/* ============================================================
   LEDGER — navigation & router
   ============================================================ */
const PAGES = [
  { id: 'today', label: 'Today', dot: 'ink' },
  { id: 'week', label: 'This Week', dot: 'ink' },
  { id: 'training', label: 'Training', dot: 'track' },
  { id: 'academic', label: 'Academic', dot: 'ink' },
  { id: 'languages', label: 'Languages', dot: 'signal' },
  { id: 'projects', label: 'Projects', dot: 'amber' },
  { id: 'skills', label: 'Skill Tree', dot: 'violet' },
  { id: 'charts', label: 'Heatmap & Charts', dot: 'ink' },
  { id: 'reflection', label: 'Reflection', dot: 'violet' },
  { id: 'settings', label: 'Settings', dot: 'faint' }
];

let currentPage = 'today';

function renderNav() {
  const nav = document.getElementById('nav-list');
  nav.innerHTML = PAGES.map(p => `
    <button class="nav-item ${p.id === currentPage ? 'active' : ''}" data-page="${p.id}">
      <span class="nav-dot" style="background:var(--${p.dot === 'faint' ? 'text-faint' : p.dot})"></span>
      ${p.label}
    </button>
  `).join('');
  nav.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => goTo(btn.dataset.page));
  });
}

async function goTo(pageId) {
  currentPage = pageId;
  location.hash = pageId;
  renderNav();
  closeSidebar();
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('page-' + pageId);
  if (el) el.classList.add('active');
  const label = PAGES.find(p => p.id === pageId);
  document.getElementById('topbar-title').textContent = label ? label.label : '';
  const renderer = PAGE_RENDERERS[pageId];
  if (renderer) await renderer();
}

function initRouter() {
  const hash = location.hash.replace('#', '');
  const start = PAGES.find(p => p.id === hash) ? hash : 'today';
  goTo(start);
}
window.addEventListener('hashchange', () => {
  const hash = location.hash.replace('#', '');
  if (PAGES.find(p => p.id === hash)) goTo(hash);
});
/* ============================================================
   LEDGER — Today page
   ============================================================ */
function greeting(name) {
  const h = new Date().getHours(), g = h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  return name ? `${g}, ${escapeHtml(name)}` : g;
}
function countTo(el, from, to) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || from === to) { el.textContent = to + '%'; return; }
  const t0 = performance.now(), dur = 650;
  const f = (t) => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(from + (to - from) * e) + '%'; if (k < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
async function getMeta(k, def) { const r = await dbGet('meta', k); return r && r.value !== undefined ? r.value : def; }
async function setMeta(k, v) { await dbPut('meta', { key: k, value: v }); }

async function renderToday() {
  const container = document.getElementById('page-today');
  const iso = todayISO(); window.__day = iso;
  const dName = dayName(iso);
  const plan = DAY_PLAN[dName];
  const [courses, assignments, habits, habitLogs, runs, strength, recovery, reflections, events, tasks, doneKeys, user] = await Promise.all([
    dbGetAll('courses'), dbGetAll('assignments'), dbGetAll('habits'), dbGetAll('habitLogs'),
    dbGetAll('runs'), dbGetAll('strengthSessions'), dbGetAll('recoveryLogs'), dbGetAll('dailyReflections'),
    getMeta('events', []), getMeta('tasks', []), getMeta('done-' + iso, []), getMeta('user', '')
  ]);
  const todayLogs = habitLogs.filter(l => l.date === iso);
  const dailyHabits = habits.filter(h => h.frequency === 'daily' && !h.archived);
  const weeklyHabits = habits.filter(h => h.frequency === 'weekly' && !h.archived);
  const open = assignments.filter(a => a.status !== 'done' && a.dueDate).sort((a, b) => a.dueDate.localeCompare(b.dueDate)).slice(0, 8);
  const overdue = open.filter(a => a.dueDate < iso);
  const dueSoon = open.filter(a => a.dueDate >= iso && daysBetween(iso, a.dueDate) <= 3);
  const dueLater = open.filter(a => a.dueDate >= iso && daysBetween(iso, a.dueDate) > 3);
  const trainedToday = runs.some(r => r.date === iso) || strength.some(s => s.date === iso);
  const recoveryToday = recovery.find(r => r.date === iso);
  const reflectionToday = reflections.find(r => r.date === iso);
  const dn = k => doneKeys.includes(k);

  const must = [];
  courses.filter(c => c.day === dName && c.status !== 'dropped').forEach(c =>
    must.push({ key: 'c:' + c.id, text: `Class: ${escapeHtml(c.code || '')} ${escapeHtml(c.name)} ${c.time ? '(' + escapeHtml(c.time) + ')' : ''}`, tag: 'ink', done: dn('c:' + c.id) }));
  events.filter(e => e.day === dName).sort((a, b) => (a.time || '').localeCompare(b.time || '')).forEach(e =>
    must.push({ key: 'e:' + e.id, text: `${e.time ? escapeHtml(e.time) + ' · ' : ''}${escapeHtml(e.title)}`, tag: 'ink', done: dn('e:' + e.id) }));
  overdue.forEach(a => must.push({ key: 'a:' + a.id, kind: 'assign', id: a.id, text: `Overdue: ${escapeHtml(a.title)} (${escapeHtml(a.course || '')})`, tag: 'danger' }));
  open.filter(a => a.dueDate === iso).forEach(a => must.push({ key: 'a:' + a.id, kind: 'assign', id: a.id, text: `Due today: ${escapeHtml(a.title)}`, tag: 'danger' }));
  if (plan.training !== 'rest' && (plan.intensity === 'hard' || plan.training === 'gym' || plan.training === 'run')) {
    must.push({ key: 'train', text: `Training: ${labelTraining(plan.training)} (${plan.intensity})`, tag: 'track', done: trainedToday || dn('train') });
  }
  const mine = tasks.filter(t => t.date === iso || (t.date < iso && !t.done)).map(t => ({ key: 't:' + t.id, kind: 'task', id: t.id, text: escapeHtml(t.text), tag: 'violet', done: t.done }));
  const should = [];
  dueSoon.forEach(a => should.push({ key: 'a:' + a.id, kind: 'assign', id: a.id, text: `Due in ${daysBetween(iso, a.dueDate)}d: ${escapeHtml(a.title)}`, tag: 'ink' }));
  dailyHabits.forEach(h => should.push({ key: 'h:' + h.id, kind: 'habit', id: h.id, text: `${escapeHtml(h.name)}${h.minViable ? ' — min: ' + escapeHtml(h.minViable) : ''}`, tag: 'amber', done: todayLogs.some(l => l.habitId === h.id) }));
  const could = [];
  dueLater.forEach(a => could.push({ key: 'a:' + a.id, kind: 'assign', id: a.id, text: `${escapeHtml(a.title)} — due ${shortDate(a.dueDate)}`, tag: 'faint' }));
  weeklyHabits.forEach(h => could.push({ key: 'h:' + h.id, kind: 'habit', id: h.id, text: `${escapeHtml(h.name)} (weekly: ${escapeHtml(h.target || '')})`, tag: 'violet', done: todayLogs.some(l => l.habitId === h.id) }));
  if (plan.training === 'recovery') could.push({ key: 'mob', text: 'Light mobility / stretching', tag: 'violet', done: dn('mob') });

  const score = await computeDailyScore(iso);
  const sec = (title, list, emptyMsg) => `<div class="section"><div class="section-head"><div class="section-title">${title} <span class="n">(${list.filter(i => !i.done).length} left)</span></div></div>${list.length ? `<div class="card">${list.map(renderTodoLine).join('')}</div>` : `<div class="empty">${emptyMsg}</div>`}</div>`;

  container.innerHTML = `
    <div class="page-head">
      <div>
        <div class="big-clock" id="live-clock"></div>
        <h1 class="page-title">${dName}</h1>
        <div class="page-sub">${greeting(user)} · ${shortDate(iso)} · ${escapeHtml(plan.note)}</div>
      </div>
      <div class="stat ink" style="text-align:right;"><div class="stat-num">${score}%</div><div class="stat-label">today's weighted score</div></div>
    </div>
    <div class="section">
      <div class="section-head"><div class="section-title">My tasks <span class="n">(${mine.filter(i => !i.done).length} left)</span></div></div>
      <div class="card">
        <div class="row" style="gap:8px;margin-bottom:${mine.length ? '10px' : '0'};"><input id="new-task" placeholder="Add a task for today…" style="flex:1;"><button class="btn primary small" id="add-task">Add</button></div>
        ${mine.map(renderTodoLine).join('')}
      </div>
    </div>
    ${sec('Must do', must, 'Nothing critical today.')}
    ${sec('Should do', should, 'Should-do list is clear.')}
    ${sec('Could do', could, 'Nothing optional queued.')}
    <div class="section">
      <div class="section-head"><div class="section-title">Tonight</div></div>
      <div class="grid grid-3">
        <div class="card">
          <div class="row between"><strong style="font-size:13px;">Training</strong><span class="pill ${trainedToday ? '' : 'track'}">${trainedToday ? 'logged' : 'not yet'}</span></div>
          <p class="muted" style="font-size:12px;margin:8px 0 10px;">${labelTraining(plan.training)} planned today.</p>
          <button class="btn small" onclick="goTo('training')">Log training →</button>
        </div>
        <div class="card">
          <div class="row between"><strong style="font-size:13px;">Recovery</strong><span class="pill ${recoveryToday ? '' : 'violet'}">${recoveryToday ? 'logged' : 'not yet'}</span></div>
          <p class="muted" style="font-size:12px;margin:8px 0 10px;">Sleep and readiness check-in.</p>
          <button class="btn small" onclick="openRecoveryModal()">Log recovery →</button>
        </div>
        <div class="card">
          <div class="row between"><strong style="font-size:13px;">Reflection</strong><span class="pill ${reflectionToday ? '' : 'amber'}">${reflectionToday ? 'logged' : 'not yet'}</span></div>
          <p class="muted" style="font-size:12px;margin:8px 0 10px;">A few short prompts to close the day.</p>
          <button class="btn small" onclick="goTo('reflection')">Reflect →</button>
        </div>
      </div>
    </div>`;

  const addTask = async () => {
    const inp = document.getElementById('new-task'); const text = inp.value.trim(); if (!text) return;
    const list = await getMeta('tasks', []); list.push({ id: uid(), text, date: iso, done: false });
    await setMeta('tasks', list); renderToday();
  };
  document.getElementById('add-task').addEventListener('click', addTask);
  document.getElementById('new-task').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
  container.onclick = async (e) => {
    const t = e.target.closest('[data-todo]');
    if (t) { t.classList.add('pop'); await toggleTodo(t.dataset.todo, t.dataset.kind, t.dataset.id, iso); if (!matchMedia('(prefers-reduced-motion: reduce)').matches) await new Promise(r => setTimeout(r, 170)); renderToday(); return; }
    const d = e.target.closest('[data-del-task]');
    if (d) { const list = (await getMeta('tasks', [])).filter(x => x.id !== d.dataset.delTask); await setMeta('tasks', list); renderToday(); }
  };
  const ah = await actsTodayHtml(iso);
  if (ah && !container.querySelector('[data-acts-sec]')) { const f = container.querySelector('.section'); if (f) f.insertAdjacentHTML('afterend', ah); }
  const sn = container.querySelector('.stat-num'); if (sn) countTo(sn, window.__lastScore || 0, score); window.__lastScore = score;
  const clk = document.getElementById('live-clock'); if (clk) clk.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

async function toggleTodo(key, kind, id, iso) {
  if (kind === 'habit') {
    const logs = (await dbGetAll('habitLogs')).filter(l => l.habitId === id && l.date === iso);
    if (logs.length) { for (const l of logs) await dbDelete('habitLogs', l.id); }
    else await dbPut('habitLogs', { id: uid(), habitId: id, date: iso, level: 'min', createdAt: nowISO() });
  } else if (kind === 'task') {
    const list = await getMeta('tasks', []); const t = list.find(x => x.id === id); if (t) t.done = !t.done; await setMeta('tasks', list);
  } else if (kind === 'assign') {
    const a = await dbGet('assignments', id); a.status = 'done'; await dbPut('assignments', a); toast('Marked done.');
  } else {
    const arr = await getMeta('done-' + iso, []); const i = arr.indexOf(key);
    if (i >= 0) arr.splice(i, 1); else arr.push(key); await setMeta('done-' + iso, arr);
  }
}

function renderTodoLine(item) {
  const col = item.tag === 'faint' ? 'text-faint' : item.tag;
  return `<div class="list-item todo ${item.done ? 'is-done' : ''}"><span class="todo-main"><button class="tick ${item.done ? 'on' : ''}" style="${item.done ? '' : 'border-color:var(--' + col + ');'}" data-todo="${item.key}" data-kind="${item.kind || ''}" data-id="${item.id || ''}" aria-label="Toggle done">${item.done ? '✓' : ''}</button><span class="todo-text">${item.text}</span></span>${item.kind === 'task' ? `<button class="btn ghost small" data-del-task="${item.id}">✕</button>` : ''}</div>`;
}

function labelTraining(t) {
  return { gym: 'Gym / strength', run: 'Run', long_run: 'Long run', recovery: 'Recovery / mobility', rest: 'Rest', other: 'Other activity' }[t] || t;
}

async function quickLogHabit(habitId) {
  await dbPut('habitLogs', { id: uid(), habitId, date: todayISO(), level: 'min', createdAt: nowISO() });
  toast('Habit logged.');
  renderToday();
}

async function computeDailyScore(iso) {
  const weights = await getWeights();
  const [habits, habitLogs, runs, strength, studySessions, languageLogs, projects, recoveryLogs] = await Promise.all([
    dbGetAll('habits'), dbGetAll('habitLogs'), dbGetAll('runs'), dbGetAll('strengthSessions'),
    dbGetAll('studySessions'), dbGetAll('languageLogs'), dbGetAll('projects'), dbGetAll('recoveryLogs')
  ]);
  const todayLogs = habitLogs.filter(l => l.date === iso);

  // each domain: 0-100 based on achievement-weighted activity for the day, not just checkbox count
  const academic = clamp(studySessions.filter(s => s.date === iso).reduce((sum, s) => sum + (s.type === 'output' ? 40 : s.type === 'practice' ? 22 : 10), 0), 0, 100);
  const physical = clamp((runs.some(r => r.date === iso) ? 55 : 0) + (strength.some(s => s.date === iso) ? 55 : 0), 0, 100);
  const languages = clamp(languageLogs.filter(l => l.date === iso).reduce((sum, l) => sum + (l.type === 'speaking' ? 35 : 20), 0), 0, 100);
  const professional = clamp(projects.filter(p => p.lastWorkedDate === iso).length * 50, 0, 100);
  const recovery = recoveryLogs.some(r => r.date === iso) ? 100 : 0;
  const dailyHabits = habits.filter(h => h.frequency === 'daily' && !h.archived);
  const discipline = dailyHabits.length ? clamp(Math.round((todayLogs.length / dailyHabits.length) * 100), 0, 100) : 0;

  const total =
    academic * weights.academic +
    physical * weights.physical +
    languages * weights.languages +
    professional * weights.professional +
    recovery * weights.recovery +
    discipline * weights.discipline;
  const maxPossible = Object.values(weights).reduce((a, b) => a + b, 0) * 100;
  return Math.round((total / maxPossible) * 100);
}

async function renderWeek() {
  const container = document.getElementById('page-week');
  const dnames = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const todayName = dayName(todayISO());

  const [runs, strength, habits, habitLogs, assignments] = await Promise.all([
    dbGetAll('runs'), dbGetAll('strengthSessions'), dbGetAll('habits'), dbGetAll('habitLogs'), dbGetAll('assignments')
  ]);

  // map this calendar week's dates (Mon-Sun)
  const now = new Date();
  const jsDay = now.getDay(); // 0 sun .. 6 sat
  const mondayOffset = jsDay === 0 ? -6 : 1 - jsDay;
  const weekDates = {};
  dnames.forEach((name, i) => {
    weekDates[name] = todayISO(mondayOffset + i);
  });

  const weeklyRunDist = runs.filter(r => Object.values(weekDates).includes(r.date))
    .reduce((s, r) => s + (Number(r.distanceKm) || 0), 0);
  const weeklyStrengthCount = strength.filter(s => Object.values(weekDates).includes(s.date)).length;

  const _courses = await dbGetAll('courses'), _events = await getMeta('events', []);
  const dayCards = dnames.map(name => {
    const cls = [..._courses.filter(c => c.day === name && c.status !== 'dropped').map(c => `${c.code || c.name} · ${c.time || ''}`), ..._events.filter(e => e.day === name).map(e => `${e.title} · ${e.time || ''}`)];
    const plan = DAY_PLAN[name];
    const date = weekDates[name];
    const isToday = name === todayName;
    const ranThatDay = runs.some(r => r.date === date);
    const liftedThatDay = strength.some(s => s.date === date);
    return `
      <div class="card" style="${isToday ? 'border-color:var(--ink);' : ''}">
        <div class="row between">
          <strong style="font-size:13px;">${name}${isToday ? ' <span class="pill ink">today</span>' : ''}</strong>
          <span class="faint mono">${shortDate(date)}</span>
        </div>

        <div class="row" style="gap:8px;margin-top:8px;">
          <span class="pill track">${labelTraining(plan.training)}</span>
          <span class="faint" style="font-size:12px;">${plan.intensity}</span>
        </div>
        <div style="margin-top:8px;font-size:12px;" class="muted">

          ${(!ranThatDay && !liftedThatDay) ? '<span class="faint">not logged yet</span>' : ''}
        </div>
      </div>`;
  }).join('');

  const dueThisWeek = assignments
    .filter(a => a.status !== 'done' && a.dueDate && Object.values(weekDates).includes(a.dueDate))
    .sort((a, b) => a.dueDate.localeCompare(b.dueDate));

  const weeklyHabits = habits.filter(h => h.frequency === 'weekly' && !h.archived);
  const weeklyHabitProgress = weeklyHabits.map(h => {
    const count = habitLogs.filter(l => l.habitId === h.id && Object.values(weekDates).includes(l.date)).length;
    return { h, count };
  });

  container.innerHTML = `
    <div class="page-head">
      <div>
        <h1 class="page-title">This Week</h1>
        <div class="page-sub">${shortDate(weekDates.Monday)} – ${shortDate(weekDates.Sunday)}</div>
      </div>
    </div>

    <div class="section">
      <div class="grid grid-3">
        <div class="stat track"><div class="stat-num">${round1(weeklyRunDist)} km</div><div class="stat-label">running this week</div></div>
        <div class="stat track"><div class="stat-num">${weeklyStrengthCount}</div><div class="stat-label">strength sessions</div></div>
        <div class="stat ink"><div class="stat-num">${dueThisWeek.length}</div><div class="stat-label">deadlines this week</div></div>
      </div>
    </div>

    <div class="section">

    </div>

    <div class="section">
      <div class="section-head"><div class="section-title">Weekly habit targets</div></div>
      <div class="card">
        ${weeklyHabitProgress.length ? weeklyHabitProgress.map(({h, count}) => `
          <div class="list-item">
            <span>${escapeHtml(h.name)} <span class="faint mono">(${h.target})</span></span>

  const avgReadiness = last7.length ? round1(last7.reduce((s, l) => s + Number(l.readiness || 0), 0) / last7.length) : 0;

  // overload flag: 2+ hard sessions in a row with no recovery day logged between
  const [runs, strength] = await Promise.all([dbGetAll('runs'), dbGetAll('strengthSessions')]);
  const last3days = [todayISO(), todayISO(-1), todayISO(-2)];

    strength.some(s => s.date === d)

  const recentRecoveryLog = logs.some(l => last3days.includes(l.date) && Number(l.readiness) <= 2);
  const overloadFlag = hardSessions >= 3 || (hardSessions >= 2 && recentRecoveryLog);

  return `

function currentWeekDates() {
  const now = new Date();
  const jsDay = now.getDay();
  const mondayOffset = jsDay === 0 ? -6 : 1 - jsDay;
  const arr = [];
  for (let i = 0; i < 7; i++) arr.push(todayISO(mondayOffset + i));

}

function computeStreakFromDates(dates) {
  const set = new Set(dates);
  let streak = 0;
  let cursor = todayISO();
  while (set.has(cursor)) {
    streak++;
    cursor = todayISO(-streak);
  }
  return streak;
}

// evidence thresholds to advance a level — deliberately not 1:1 with checkbox counts
const LEVEL_THRESHOLDS = [0, 3, 8, 16, 28, 45];

function levelFromEvidence(count) {
  let lvl = 1;
  for (let i = 1; i < LEVEL_THRESHOLDS.length; i++) {
    if (count >= LEVEL_THRESHOLDS[i]) lvl = i + 1;
  }
  return clamp(lvl, 1, LEVEL_THRESHOLDS.length);
}

async function bumpSkillEvidence(skillName) {
  const skills = await dbGetAll('skills');
  const skill = skills.find(s => s.name === skillName);
  if (!skill) return;
  skill.evidenceCount = (skill.evidenceCount || 0) + 1;
  skill.level = levelFromEvidence(skill.evidenceCount);
  skill.lastPracticed = todayISO();
  await dbPut('skills', skill);
}

async function renderSkills() {
  const container = document.getElementById('page-skills');
  const skills = await dbGetAll('skills');
  const groups = Object.keys(SKILL_TREE);

  container.innerHTML = `
    <div class="page-head">
      <div><h1 class="page-title">Skill Tree</h1><div class="page-sub">Levels advance on logged evidence — sessions, output, PRs — not on checkbox count alone.</div></div>
    </div>
    ${groups.map(group => {
      const items = skills.filter(s => s.group === group).sort((a, b) => a.name.localeCompare(b.name));
      const color = group === 'Physical' ? 'track' : group === 'Languages' ? 'signal' : group === 'Professional' ? 'amber' : 'ink';
      return `
        <div class="section">
          <div class="section-head"><div class="section-title">${group}</div></div>
          <div class="grid grid-3">
            ${items.map(s => {
              const nextThreshold = LEVEL_THRESHOLDS[Math.min(s.level, LEVEL_THRESHOLDS.length - 1)] || LEVEL_THRESHOLDS[LEVEL_THRESHOLDS.length - 1];
              const prevThreshold = LEVEL_THRESHOLDS[s.level - 1] || 0;
              const span = Math.max(1, nextThreshold - prevThreshold);
              const progress = clamp(Math.round(((s.evidenceCount - prevThreshold) / span) * 100), 0, 100);
              return `
                <div class="card">
                  <div class="row between"><strong style="font-size:13px;">${escapeHtml(s.name)}</strong><span class="pill ${color}">Lv ${s.level}</span></div>
                  <div class="bar-track" style="margin-top:10px;"><div class="bar-fill" style="width:${progress}%;background:var(--${color === 'faint' ? 'text-faint' : color});"></div></div>
                  <div class="faint" style="font-size:11px;margin-top:5px;">${s.evidenceCount} evidence logged ${s.lastPracticed ? '· last ' + shortDate(s.lastPracticed) : '· not started'}</div>
                </div>`;
            }).join('')}

async function collectActivityDates() {
  const stores = ['habitLogs', 'runs', 'strengthSessions', 'studySessions', 'languageLogs', 'recoveryLogs'];
  const all = await Promise.all(stores.map(s => dbGetAll(s)));
  const dates = {};
  all.flat().forEach(rec => {
    if (rec.date) dates[rec.date] = (dates[rec.date] || 0) + 1;
  });
  (await dbGetAll('meta')).forEach(m => {
    if (m.key && m.key.startsWith('alog-')) { const n = Object.keys(m.value || {}).length; if (n) dates[m.key.slice(5)] = (dates[m.key.slice(5)] || 0) + n; }
    else if (m.key && m.key.startsWith('focus-') && m.value > 0) dates[m.key.slice(6)] = (dates[m.key.slice(6)] || 0) + 1;
  });
  return dates;
}

function setupCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, w: rect.width, h: rect.height };
}

async function drawHeatmap() {
  const canvas = document.getElementById('heatmap-canvas');
  if (!canvas) return;
  const { ctx, w, h } = setupCanvas(canvas);
  const dates = await collectActivityDates();
  const weeks = 12;
  const cell = Math.min(14, (w - 20) / weeks);
  const gap = 3;
  const startOffset = -(weeks * 7 - 1);

  const draw = (upTo) => {
    ctx.clearRect(0, 0, w, h);
    for (let week = 0; week < weeks; week++) {
      for (let d = 0; d < 7; d++) {
        const iso = todayISO(startOffset + week * 7 + d);
        const count = dates[iso] || 0;
        const level = count === 0 ? 0 : Math.ceil(clamp(count / 4, 0, 1) * 4);
        ctx.fillStyle = (week > upTo) ? '#171B22' : level === 0 ? '#171B22' : mixColor('#4a0d0b', '#E10600', (level - 1) / 3);
        roundRect(ctx, 10 + week * (cell + gap), 10 + d * (cell + gap), cell, cell, 3);
        ctx.fill();
      }
    }
  };
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) draw(weeks);
  else { let k = 0; const step = () => { draw(k++); if (k <= weeks) requestAnimationFrame(step); }; step(); }
}

function mixColor(c1, c2, t) {
  const p1 = hexToRgb(c1), p2 = hexToRgb(c2);
  const r = Math.round(p1.r + (p2.r - p1.r) * t);
  const g = Math.round(p1.g + (p2.g - p1.g) * t);
  const b = Math.round(p1.b + (p2.b - p1.b) * t);
  return `rgb(${r},${g},${b})`;
}
function hexToRgb(hex) {
  const n = parseInt(hex.replace('#', ''), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

async function drawScoreLine() {
  const canvas = document.getElementById('score-canvas');
  if (!canvas) return;
  const { ctx, w, h } = setupCanvas(canvas);
  const days = [];
  for (let i = -13; i <= 0; i++) days.push(todayISO(i));
  const scores = [];
  for (const d of days) scores.push(await computeDailyScore(d));

  ctx.clearRect(0, 0, w, h);
  const pad = 24;
  const maxY = 100;
  const stepX = (w - pad * 2) / (days.length - 1);

  // gridlines
  ctx.strokeStyle = '#20252d';
  ctx.lineWidth = 1;
  [0, 25, 50, 75, 100].forEach(v => {
    const y = h - pad - (v / maxY) * (h - pad * 2);
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w - pad, y); ctx.stroke();
  });

  ctx.strokeStyle = '#DCE3EA';
  ctx.lineWidth = 2;
  ctx.beginPath();
  scores.forEach((s, i) => {
    const x = pad + i * stepX;
    const y = h - pad - (s / maxY) * (h - pad * 2);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  ctx.fillStyle = '#DCE3EA';
  scores.forEach((s, i) => {
    const x = pad + i * stepX;
    const y = h - pad - (s / maxY) * (h - pad * 2);
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill();
  });
}

async function drawRunBars() {
  const canvas = document.getElementById('run-canvas');
  if (!canvas) return;
  const { ctx, w, h } = setupCanvas(canvas);
  const runs = await dbGetAll('runs');
  const weeks = [];
  const now = new Date();
  const jsDay = now.getDay();
  const mondayOffset = jsDay === 0 ? -6 : 1 - jsDay;
  for (let i = 7; i >= 0; i--) {
    const weekStart = mondayOffset - i * 7;
    const dates = [];
    for (let d = 0; d < 7; d++) dates.push(todayISO(weekStart + d));
    const dist = runs.filter(r => dates.includes(r.date)).reduce((s, r) => s + Number(r.distanceKm || 0), 0);
    weeks.push(dist);
  }
  const maxDist = Math.max(5, ...weeks);
  ctx.clearRect(0, 0, w, h);
  const pad = 24;
  const barW = (w - pad * 2) / weeks.length * 0.6;
  const gap = (w - pad * 2) / weeks.length;
  weeks.forEach((dist, i) => {
    const barH = (dist / maxDist) * (h - pad * 2);
    const x = pad + i * gap + (gap - barW) / 2;
    const y = h - pad - barH;
    ctx.fillStyle = '#E10600';
    roundRect(ctx, x, y, barW, barH, 2);
    ctx.fill();
  });
}

function importDataFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      openModal(`
        <h3>Import backup</h3>
        <p class="muted" style="font-size:13px;">This will overwrite existing records with matching IDs. Continue?</p>
        <div class="row" style="justify-content:flex-end;margin-top:12px;">
          <button class="btn ghost" onclick="closeModal()">Cancel</button>
          <button class="btn primary" id="confirm-import">Import</button>
        </div>
      `);
      document.getElementById('confirm-import').addEventListener('click', async () => {
        for (const s of STORES) {
          if (Array.isArray(data[s.name])) {
            for (const rec of data[s.name]) await dbPut(s.name, rec);
          }
        }
        closeModal(); toast('Import complete.'); goTo(currentPage);
      });
    } catch (err) {
      toast('Invalid backup file.', true);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const LN=()=>window.Capacitor.Plugins.LocalNotifications;
async function nativePerm(){try{const p=(await LN().checkPermissions()).display;return p==='granted'?'granted':p==='denied'?'denied':'default';}catch(e){return 'denied';}}
async function scheduleNative(){
  try{
    const ln=LN(),pend=await ln.getPending();
    if(pend.notifications.length)await ln.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
    const rec=await loadRem(),list=[];
    rec.items.forEach((it,i)=>{if(!it.on)return;const[h,m]=it.time.split(':').map(Number);
      it.days.forEach(d=>list.push({id:1000+i*10+d,title:it.label,body:it.body,schedule:{on:{weekday:d+1,hour:h,minute:m},allowWhileIdle:true}}));});
    if(list.length)await ln.schedule({notifications:list});
  }catch(e){}
}
async function fireNote(title,body,tag){
  if(NATIVE){try{await LN().schedule({notifications:[{id:9999,title,body,schedule:{at:new Date(Date.now()+2000)}}]});return true;}catch(e){return false;}}
  if(!('Notification' in window)||Notification.permission!=='granted')return false;
  try{
    const reg=('serviceWorker' in navigator)?await navigator.serviceWorker.getRegistration():null;
    if(reg)await reg.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png',data:{url:'./#today'}});
    else new Notification(title,{body,tag});
    return true;
  }catch(e){return false;}
}
async function checkReminders(){
  if(NATIVE)return;
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const rec=await loadRem(),now=new Date(),iso=todayISO(),mins=now.getHours()*60+now.getMinutes();
  rec.fired=rec.fired||{};let ch=false;
  for(const it of rec.items){
    if(!it.on||!it.days.includes(now.getDay())||rec.fired[it.id]===iso)continue;
    const[h,m]=it.time.split(':').map(Number),t=h*60+m;
    if(mins>=t&&mins-t<=90){
      let body=it.body;
      if(it.id==='night'){const n=await habitsLeft();if(n>0)body+=` ${n} daily habit${n>1?'s':''} still open.`;}
      if(await fireNote(it.label,body,it.id)){rec.fired[it.id]=iso;ch=true;}
    }
  }
  if(ch)await dbPut('meta',rec);
}

    if (b.dataset.fm) FX.mode = b.dataset.fm;
    if (b.dataset.fmin) { FX.min = +b.dataset.fmin; FX.left = FX.min * 60; }
    if (b.id === 'fx-go') { if (t) { if (FX.running) { FX.left = (FX.endAt - Date.now()) / 1000; FX.running = false; } else { const cu = document.getElementById('fx-custom'); if (cu && +cu.value) { FX.min = +cu.value; FX.left = FX.min * 60; } FX.endAt = Date.now() + FX.left * 1000; FX.running = true; } } else { if (FX.swRun) { FX.swAcc += Date.now() - FX.swStart; FX.swRun = false; } else { FX.swStart = Date.now(); FX.swRun = true; } } }
    if (b.id === 'fx-reset') { FX.running = false; FX.left = FX.min * 60; FX.swAcc = 0; FX.swRun = false; }
    if (b.id === 'fx-save') { const m = Math.round(fxSecs() / 60); if (m < 1) { toast('Under a minute. Nothing to save.', true); return; } await logFocus(m); FX.swAcc = 0; FX.swRun = false; toast(`${m} min saved.`); }
    renderFocus();
  };
  const sel = document.getElementById('fx-act'); if (sel) sel.onchange = () => { FX.actId = sel.value; };
}

/* ---- Goals ---- */
async function renderGoals() {
  const c = document.getElementById('page-goals'), goals = await getMeta('goals', []), iso = todayISO();
  const prog = g => g.ms && g.ms.length ? Math.round(g.ms.filter(m => m.done).length / g.ms.length * 100) : (g.manual || 0);
  c.innerHTML = `<div class="page-head"><div><h1 class="page-title">Goals</h1><div class="page-sub">Long-term targets with milestones.</div></div><button class="btn primary" id="goal-new">+ Goal</button></div>
    ${goals.length ? goals.map((g, gi) => { const p = prog(g); return `<div class="card" style="margin-bottom:12px;"><div class="row between"><strong>${escapeHtml(g.title)}</strong><span class="pill ${p >= 100 ? 'signal' : 'track'}">${p >= 100 ? 'complete' : p + '%'}</span></div>
      <div class="bar-track" style="margin:10px 0 6px;"><div class="bar-fill" style="width:${p}%;background:var(--track);"></div></div>
      <div class="faint" style="font-size:12px;">${g.target ? `Target ${shortDate(g.target)} · ${daysBetween(iso, g.target) >= 0 ? daysBetween(iso, g.target) + ' days left' : 'past target date'}` : 'No target date'}</div>
      ${(g.ms || []).map((m, mi) => `<div class="list-item ${m.done ? 'is-done' : ''}"><span class="todo-main"><button class="tick ${m.done ? 'on' : ''}" data-gm="${gi}:${mi}" aria-label="Toggle milestone">${m.done ? '✓' : ''}</button><span class="todo-text">${escapeHtml(m.t)}</span></span></div>`).join('')}
      ${(g.ms || []).length ? '' : `<input type="range" min="0" max="100" value="${g.manual || 0}" data-gp="${gi}" style="width:100%;margin-top:10px;" aria-label="Progress">`}
      <div class="row" style="gap:6px;margin-top:10px;"><button class="btn ghost small" data-ge="${gi}">Edit</button><button class="btn ghost small" data-gd="${gi}">Delete</button></div></div>`; }).join('') : '<div class="empty">Add a goal, then break it into milestones.</div>'}`;
  document.getElementById('goal-new').onclick = () => goalModal();
  c.onclick = async e => {
    const b = e.target.closest('[data-gm],[data-ge],[data-gd]'); if (!b) return;
    if (b.dataset.gm) { const [i, j] = b.dataset.gm.split(':').map(Number); goals[i].ms[j].done = !goals[i].ms[j].done; await setMeta('goals', goals); renderGoals(); }
    else if (b.dataset.ge) goalModal(+b.dataset.ge);
    else if (confirm('Delete this goal?')) { goals.splice(+b.dataset.gd, 1); await setMeta('goals', goals); renderGoals(); }
  };
  c.querySelectorAll('[data-gp]').forEach(r => r.onchange = async () => { goals[+r.dataset.gp].manual = +r.value; await setMeta('goals', goals); renderGoals(); });
}
async function goalModal(idx) {
  const goals = await getMeta('goals', []), g = idx != null ? goals[idx] : { title: '', target: '', ms: [] };
  openModal(`<h3>${idx != null ? 'Edit' : 'New'} goal</h3><div class="field"><label>Goal</label><input id="g-t" value="${escapeHtml(g.title)}" placeholder="e.g. Run a 10K"></div>
    <div class="field"><label>Target date</label><input id="g-d" type="date" value="${g.target || ''}"></div>
    <div class="field"><label>Milestones (one per line)</label><textarea id="g-m">${escapeHtml((g.ms || []).map(m => m.t).join('\n'))}</textarea></div>
    <div class="row" style="justify-content:flex-end;margin-top:8px;"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="g-save">Save</button></div>`);
  document.getElementById('g-save').onclick = async () => {
    const title = document.getElementById('g-t').value.trim(); if (!title) { toast('Name your goal.', true); return; }
    const old = g.ms || [], ms = document.getElementById('g-m').value.split('\n').map(x => x.trim()).filter(Boolean).map(t => ({ t, done: !!(old.find(o => o.t === t) || {}).done }));
    const ng = Object.assign({}, g, { title, target: document.getElementById('g-d').value, ms });
    if (idx != null) goals[idx] = ng; else goals.push(ng);
    await setMeta('goals', goals); closeModal(); renderGoals();
  };
}

/* ---- Insights: real data only ---- */
let INS_DAYS = 7;
async function renderInsights() {
  const c = document.getElementById('page-insights'), acts = await getActs(), days = [];
  for (let i = INS_DAYS - 1; i >= 0; i--) { const iso = todayISO(-i), l = await getLog(iso), due = acts.filter(a => isDue(a, iso)), done = due.filter(a => isDone(a, l[a.id])); days.push({ iso, due: due.length, done: done.length, focus: (await getMeta('focus-' + iso, 0)) || 0, l }); }
  const sd = days.reduce((a, d) => a + d.done, 0), su = days.reduce((a, d) => a + d.due, 0), active = days.filter(d => d.done || d.focus).length, fm = days.reduce((a, d) => a + d.focus, 0), maxF = Math.max(1, ...days.map(d => d.focus));
  const per = acts.filter(a => a.status !== 'archived').map(a => { let du = 0, dn = 0, mins = 0; days.forEach(d => { if (isDue(a, d.iso)) { du++; if (isDone(a, d.l[a.id])) dn++; } if (a.type === 'duration') mins += d.l[a.id] || 0; }); return { a, du, dn, mins }; });
  c.innerHTML = `<div class="page-head"><div><h1 class="page-title">Insights</h1><div class="page-sub">Calculated only from what you logged.</div></div>
    <div class="row" style="gap:6px;"><button class="btn small ${INS_DAYS === 7 ? 'primary' : ''}" data-ip="7">Week</button><button class="btn small ${INS_DAYS === 30 ? 'primary' : ''}" data-ip="30">Month</button></div></div>
    <div class="grid grid-3"><div class="stat"><div class="stat-num">${su ? Math.round(sd / su * 100) : 0}%</div><div class="stat-label">activities completed</div></div><div class="stat"><div class="stat-num">${active}/${INS_DAYS}</div><div class="stat-label">active days</div></div><div class="stat"><div class="stat-num">${fm}</div><div class="stat-label">focus minutes</div></div></div>
    <div class="section"><div class="section-head"><div class="section-title">Daily completion</div></div><div class="card"><div style="display:flex;align-items:flex-end;gap:${INS_DAYS > 7 ? 2 : 8}px;height:110px;">${days.map(d => `<div title="${d.iso}: ${d.done}/${d.due}" style="flex:1;background:${d.due ? 'var(--track)' : 'var(--line)'};height:${d.due ? Math.max(4, d.done / d.due * 100) : 4}%;border-radius:3px 3px 0 0;"></div>`).join('')}</div></div></div>
    <div class="section"><div class="section-head"><div class="section-title">Focus minutes</div></div><div class="card"><div style="display:flex;align-items:flex-end;gap:${INS_DAYS > 7 ? 2 : 8}px;height:80px;">${days.map(d => `<div title="${d.iso}: ${d.focus} min" style="flex:1;background:var(--ink);height:${Math.max(3, d.focus / maxF * 100)}%;border-radius:3px 3px 0 0;"></div>`).join('')}</div></div></div>
    <div class="section"><div class="section-head"><div class="section-title">By activity</div></div>${per.length ? `<div class="card">${per.map(x => `<div style="margin-bottom:12px;"><div class="row between"><span>${escapeHtml(x.a.name)}</span><span class="faint mono" style="font-size:12px;">${x.dn}/${x.du} days${x.mins ? ' · ' + x.mins + ' min' : ''}</span></div><div class="bar-track" style="margin-top:6px;"><div class="bar-fill" style="width:${x.du ? x.dn / x.du * 100 : 0}%;background:var(--track);"></div></div></div>`).join('')}</div>` : '<div class="empty">Add activities to see statistics.</div>'}</div>`;
  const pcts = days.map(d => d.due ? Math.round(d.done / d.due * 100) : null), vals = pcts.filter(x => x !== null);
  const pts = days.map((d, i) => pcts[i] === null ? null : [i / Math.max(1, days.length - 1) * 300, 100 - pcts[i]]).filter(Boolean);
  const wk = [[], [], [], [], [], [], []]; days.forEach((d, i) => { if (pcts[i] !== null) wk[(dowOf(d.iso) + 6) % 7].push(pcts[i]); });
  const overall = su ? Math.round(sd / su * 100) : 0;
  c.querySelector('.grid-3').insertAdjacentHTML('beforebegin', `<div class="card" style="display:flex;align-items:center;gap:16px;margin-bottom:12px;">${ringSvg(overall, 112, '#E10600', 'completed')}<div style="flex:1;"><div class="faint" style="font-size:12px;">Trend</div>${pts.length > 1 ? `<svg viewBox="0 0 300 100" preserveAspectRatio="none" style="width:100%;height:70px;"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E10600" stop-opacity=".35"/><stop offset="1" stop-color="#E10600" stop-opacity="0"/></linearGradient></defs><path d="M${pts.map(q => q.join(',')).join(' L')} L300,100 L0,100Z" fill="url(#lg)"/><path class="draw" pathLength="1000" d="M${pts.map(q => q.join(',')).join(' L')}" fill="none" stroke="#E10600" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>` : '<div class="faint" style="font-size:12px;">Log a few days to see your trend.</div>'}</div></div>
    <div class="card" style="margin-bottom:12px;"><div class="section-title" style="margin-bottom:10px;">Best weekdays</div><div class="wdbars">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((n, i) => { const v = wk[i].length ? Math.round(wk[i].reduce((a, b) => a + b, 0) / wk[i].length) : 0; return `<div><div class="wdb"><i style="height:${Math.max(4, v)}%"></i></div><span>${n}</span></div>`; }).join('')}</div></div>`);
  c.onclick = e => { const b = e.target.closest('[data-ip]'); if (b) { INS_DAYS = +b.dataset.ip; renderInsights(); } };
}

PAGE_RENDERERS.activities = renderActivities; PAGE_RENDERERS.focus = renderFocus; PAGE_RENDERERS.goals = renderGoals; PAGE_RENDERERS.insights = renderInsights;

/* heatmap: tap a day to inspect */
document.addEventListener('click', async e => {
  if (e.target.id !== 'heatmap-canvas') return;
  const r = e.target.getBoundingClientRect(), weeks = 12, cell = Math.min(14, (r.width - 20) / weeks), g = 3;
  const wk = Math.floor((e.clientX - r.left - 10) / (cell + g)), d = Math.floor((e.clientY - r.top - 10) / (cell + g));
  if (wk < 0 || wk >= weeks || d < 0 || d > 6) return;
  const iso = todayISO(-(weeks * 7 - 1) + wk * 7 + d), l = await getLog(iso), acts = await getActs(), f = (await getMeta('focus-' + iso, 0)) || 0;
  const rows = acts.filter(a => l[a.id]).map(a => `<div class="list-item"><span>${escapeHtml(a.name)}</span><span class="faint mono">${a.type === 'check' ? 'done' : l[a.id] + ' ' + unitOf(a)}</span></div>`).join('');
  openModal(`<h3>${dayName(iso)} · ${shortDate(iso)}</h3>${rows || '<p class="muted" style="font-size:13px;">No activities logged.</p>'}${f ? `<div class="list-item"><span>Focus</span><span class="faint mono">${f} min</span></div>` : ''}<div class="row" style="justify-content:flex-end;margin-top:10px;"><button class="btn" onclick="closeModal()">Close</button></div>`);
});

/* ---- onboarding ---- */
const AREAS = { Habits: [['Drink water', 'number', 8, 'glasses'], ['Read', 'duration', 20], ['Meditate', 'duration', 10]], Workouts: [['Workout', 'check'], ['Run', 'duration', 30]], Studying: [['Study block', 'duration', 60], ['Language practice', 'duration', 20]], Sleep: [['Sleep', 'number', 7, 'hours']], Goals: [], Tasks: [] };
async function maybeWelcome() {
  if ((await getMeta('user', null)) !== null) return;
  let step = 0, name = '', areas = [], picks = null;
  const finish = async (skip) => {
    await setMeta('user', skip ? '' : name);
    if (picks) {
      const list = picks.map(([n, type, target, unit], i) => ({ id: uid() + i, name: n, category: areas.find(a => AREAS[a].some(x => x[0] === n)) || 'General', type, freq: 'daily', days: [1, 2, 3, 4, 5], target: target || 0, unit: unit || '', status: 'active', time: '', remind: false }));
      const extra = (document.getElementById('ob-own') || {}).value; if (extra && extra.trim()) list.push({ id: uid(), name: extra.trim(), category: 'General', type: 'check', freq: 'daily', days: [1, 2, 3, 4, 5], target: 0, unit: '', status: 'active', time: '', remind: false });
      if (list.length) { await setMeta('acts', list); const hl = await dbGetAll('habitLogs'); if (!hl.length) for (const h of await dbGetAll('habits')) { h.archived = true; await dbPut('habits', h); } }
    }
    closeModal(); goTo(areas.includes('Goals') ? 'goals' : 'today'); if (currentPage === 'today') renderToday();
  };
  const draw = () => {
    if (step === 0) openModal(`<h3>Welcome to Ledger</h3><p class="muted" style="font-size:13px;margin:0 0 12px;">Your life. Your system. Build your own routines and track only what matters to you.</p><div class="field"><label>What should I call you?</label><input id="ob-name" value="${escapeHtml(name)}" placeholder="Your name"></div><div class="row between" style="margin-top:8px;"><button class="btn ghost" id="ob-skip">Skip setup</button><button class="btn primary" id="ob-next">Next</button></div>`);
    if (step === 1) openModal(`<h3>What do you want to organize?</h3><p class="muted" style="font-size:13px;margin:0 0 10px;">Pick any. You can change everything later.</p><div class="row" style="gap:8px;flex-wrap:wrap;">${Object.keys(AREAS).map(a => `<button class="btn ${areas.includes(a) ? 'primary' : ''}" data-area="${a}">${a}</button>`).join('')}</div><div class="row between" style="margin-top:16px;"><button class="btn ghost" id="ob-skip">Skip</button><button class="btn primary" id="ob-next">Next</button></div>`);
    if (step === 2) { const sug = areas.flatMap(a => AREAS[a]); openModal(`<h3>Create your first activities</h3>${sug.length ? `<p class="muted" style="font-size:13px;margin:0 0 6px;">Untick what you don't want.</p>${sug.map((x, i) => `<label class="list-item" style="gap:10px;justify-content:flex-start;"><input type="checkbox" data-sug="${i}" checked> ${x[0]}${x[2] ? ` <span class="faint">(${x[2]} ${x[1] === 'duration' ? 'min' : x[3] || ''})</span>` : ''}</label>`).join('')}` : '<p class="muted" style="font-size:13px;">Nothing to suggest. Add your own below.</p>'}<div class="field" style="margin-top:10px;"><label>Add your own (optional)</label><input id="ob-own" placeholder="Anything you want to track"></div><div class="row between" style="margin-top:8px;"><button class="btn ghost" id="ob-skip">Skip</button><button class="btn primary" id="ob-next">Finish</button></div>`); window.__sug = sug; }
    const n = document.getElementById('ob-next'), sk = document.getElementById('ob-skip');
    sk.onclick = () => finish(step === 0);
    n.onclick = () => { if (step === 0) name = document.getElementById('ob-name').value.trim(); if (step === 2) { picks = window.__sug.filter((x, i) => document.querySelector(`[data-sug="${i}"]`).checked); return finish(false); } step++; draw(); };
    document.querySelectorAll('[data-area]').forEach(b => b.onclick = () => { const a = b.dataset.area; areas = areas.includes(a) ? areas.filter(x => x !== a) : [...areas, a]; draw(); });
  };
  draw();
}

boot().then(() => { startPhoneLayer(); startClock(); maybeWelcome(); });


</script>
