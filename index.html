<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#090B0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ledger — Life &amp; Performance OS</title>
<style>
/* ============================================================
   DESIGN TOKENS
   Ledger: an academic + athletic performance system.
   Base: cool charcoal (field-notebook-at-night), not pure black.
   Accents map to domains — track orange (physical), ink blue
   (academic), signal green (language) — so color itself carries
   meaning across the app rather than decorating it.
   Type: Fraunces (serif, personality, used for numbers & headers)
         + IBM Plex Sans (technical, for body/data/labels).
   ============================================================ */
@font-face {
  font-family: 'Fraunces';
  src: local('Fraunces');
}
:root {
  /* LEDGER / OBSIDIAN DESIGN SYSTEM */
  --bg: #090B0F;
  --bg-raised: #11151B;
  --bg-inset: #0D1015;
  --line: #292F38;
  --line-soft: #1D232C;
  --text: #F5F7FA;
  --text-dim: #A5AFBA;
  --text-faint: #697481;

  --track: #E10600;
  --track-dim: #64201F;
  --ink: #DCE3EA;
  --ink-dim: #424B56;
  --signal: #AEB8C3;
  --signal-dim: #3A424C;
  --amber: #C2CBD4;
  --amber-dim: #414A54;
  --violet: #929EAB;
  --violet-dim: #39424D;

  --danger: #FF514B;
  --good: #DCE3EA;

  --radius-s: 7px;
  --radius-m: 12px;

  --serif: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button {
  font-family: inherit;
  cursor: pointer;
}
input, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: var(--text);
  background: var(--bg-inset);
  border: 1px solid var(--line);
  border-radius: var(--radius-s);
  padding: 8px 10px;
}
input:focus, select:focus, textarea:focus, button:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 1px;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---------- layout shell ---------- */
#app {
  display: grid;
  grid-template-columns: 232px 1fr;
  min-height: 100vh;
}
@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; }
  #sidebar { display: none; }
  #sidebar.open { display: flex; position: fixed; inset: 0; z-index: 50; width: 100%; }
}

#sidebar {
  background: var(--bg-raised);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 20px 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.brand {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  padding: 0 20px 18px;
  border-bottom: 1px solid var(--line-soft);
  margin-bottom: 8px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
}
.brand .close-btn { display: none; background: none; border: none; color: var(--text-dim); font-size: 20px; }
@media (max-width: 860px) { .brand .close-btn { display: block; } }

.nav-group { margin-top: 14px; }
.nav-label {
  padding: 0 20px 6px;
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--text-faint);
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 20px;
  color: var(--text-dim);
  text-decoration: none;
  border-left: 2px solid transparent;
  font-size: 14px;
  background: none;
  border-top: none; border-right: none; border-bottom: none;
  width: 100%;
  text-align: left;
}
.nav-item:hover { color: var(--text); background: var(--bg-inset); }
.nav-item.active {
  color: var(--text);
  border-left-color: var(--ink);
  background: var(--bg-inset);
}
.nav-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

.sidebar-foot {
  margin-top: auto;
  padding: 14px 20px 0;
  border-top: 1px solid var(--line-soft);
  font-size: 12px;
  color: var(--text-faint);
}

#main {
  padding: 26px 32px 80px;
  max-width: 1120px;
  width: 100%;
}
@media (max-width: 860px) {
  #main { padding: 18px 16px 90px; }
}

.topbar {
  display: none;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
@media (max-width: 860px) {
  .topbar { display: flex; }
}
.hamburger {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: var(--radius-s);
  padding: 8px 12px;
}

.page { display: none; }
.page.active { display: block; }

.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 22px;
  flex-wrap: wrap;
  gap: 10px;
}
.page-title {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 600;
  margin: 0;
}
.page-sub { color: var(--text-dim); font-size: 13px; margin-top: 4px; }

/* ---------- primitives ---------- */
.section {
  margin-bottom: 30px;
}
.section-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--line);
  padding-bottom: 8px;
  margin-bottom: 14px;
}
.section-title {
  font-size: 13px;
  color: var(--text-dim);
  font-weight: 500;
}
.section-title .n { color: var(--text-faint); font-weight: 400; }

.card {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  padding: 16px;
}
.grid {
  display: grid;
  gap: 14px;
}
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 760px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}

.stat {
  border-left: 2px solid var(--line);
  padding: 2px 0 2px 12px;
}
.stat.track { border-color: var(--track); }
.stat.ink { border-color: var(--ink); }
.stat.signal { border-color: var(--signal); }
.stat.amber { border-color: var(--amber); }
.stat.violet { border-color: var(--violet); }
.stat-num { font-family: var(--serif); font-size: 26px; line-height: 1.1; }
.stat-label { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid var(--line);
  color: var(--text-dim);
}
.pill.track { border-color: var(--track-dim); color: var(--track); }
.pill.ink { border-color: var(--ink-dim); color: var(--ink); }
.pill.signal { border-color: var(--signal-dim); color: var(--signal); }
.pill.amber { border-color: var(--amber-dim); color: var(--amber); }
.pill.violet { border-color: var(--violet-dim); color: var(--violet); }
.pill.danger { border-color: #6b2b2b; color: var(--danger); }

.btn {
  background: var(--bg-inset);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 8px 14px;
  border-radius: var(--radius-s);
  font-size: 13px;
}
.btn:hover { border-color: var(--text-faint); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: #0b0e1a; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-dim); }
.btn.small { padding: 5px 10px; font-size: 12px; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.field label { font-size: 12px; color: var(--text-dim); }
.field input, .field select, .field textarea { width: 100%; }

.list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--line-soft);
  gap: 10px;
}
.list-item:last-child { border-bottom: none; }

.empty {
  color: var(--text-faint);
  font-size: 13px;
  padding: 18px 0;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: var(--radius-m);
}

.bar-track {
  height: 6px;
  background: var(--bg-inset);
  border-radius: 4px;
  overflow: hidden;
}
.bar-fill { height: 100%; border-radius: 4px; }

.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(10,11,13,0.72);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-m);
  padding: 22px;
  width: 100%;
  max-width: 460px;
  max-height: 86vh;
  overflow-y: auto;
}
.modal h3 { font-family: var(--serif); margin: 0 0 14px; font-size: 19px; }

.toast-wrap {
  position: fixed; bottom: 20px; right: 20px; z-index: 200;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-left: 3px solid var(--good);
  padding: 10px 14px;
  border-radius: var(--radius-s);
  font-size: 13px;
  max-width: 300px;
}
.toast.err { border-left-color: var(--danger); }

hr.hair { border: none; border-top: 1px solid var(--line-soft); margin: 14px 0; }

.mono { font-family: var(--mono); font-size: 12px; color: var(--text-dim); }
.muted { color: var(--text-dim); }
.faint { color: var(--text-faint); }
textarea { resize: vertical; min-height: 70px; }

/* ---- PHONE APP LAYER ---- */
#tabbar{display:none}
@media (max-width:860px){
  body{padding-top:env(safe-area-inset-top);-webkit-tap-highlight-color:transparent}
  #pages{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  #tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:rgba(27,30,35,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  #tabbar button{background:none;border:0;color:var(--text-faint);font-family:inherit;font-size:10.5px;font-weight:600;line-height:1;letter-spacing:.3px;
    padding:6px 0 4px;min-height:50px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;transition:color .15s}
  #tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #tabbar button.active{color:var(--text)}
  #tabbar button.active::before{content:"";position:absolute;top:-7px;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--track)}
  .btn{min-height:42px;white-space:nowrap}
  input,select,textarea{font-size:16px!important}
  .card{border-radius:10px}
  .topbar .hamburger{display:none}
  #sidebar{display:none}
  #sidebar.open{display:flex;position:fixed;inset:0;z-index:60;width:100%;padding-top:calc(20px + env(safe-area-inset-top))}
}
.rem-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.rem-row:last-child{border-bottom:0}
.rem-row input[type=time]{width:auto;min-width:96px}
.rem-row input[type=checkbox]{width:22px;height:22px;accent-color:var(--track)}

.tick{width:30px;height:30px;min-width:30px;border-radius:50%;border:2px solid var(--line);background:transparent;color:#0f1114;font-size:16px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;margin-right:12px;cursor:pointer}
.tick.on{background:var(--signal);border-color:var(--signal)}
.todo-main{display:flex;align-items:center;flex:1;min-width:0}
.is-done .todo-text{text-decoration:line-through;color:var(--text-faint)}
.plan-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.plan-row strong,.plan-row .note{grid-column:1/-1}

/* ============================================================
   LEDGER 2.0 — OBSIDIAN / ICE / RACING RED
   Progressive visual layer: keeps the existing UI and data model.
   ============================================================ */
:root { color-scheme: dark; }
body {
  background:
    radial-gradient(ellipse at 82% -18%, rgba(225,6,0,.075), transparent 38%),
    var(--bg);
  letter-spacing: -.012em;
}
#sidebar {
  background: rgba(13,16,21,.96);
  border-right-color: var(--line-soft);
  padding-top: 24px;
}
.brand {
  font-family: var(--sans);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--text);
}
.brand::after {
  content: "YOUR LIFE. YOUR SYSTEM.";
  display: block;
  position: absolute;
  top: 55px;
  left: 20px;
  color: var(--text-faint);
  font: 600 8px/1 var(--sans);
  letter-spacing: .16em;
}
.brand { position: relative; padding-bottom: 28px; }
.nav-group { margin-top: 18px; }
.nav-label { text-transform: uppercase; letter-spacing: .14em; font-weight: 700; }
.nav-item {
  margin: 2px 10px;
  width: calc(100% - 20px);
  border-left: 0;
  border-radius: 8px;
  padding: 10px 12px;
  transition: background .18s ease, color .18s ease, transform .18s ease;
}
.nav-item:hover { transform: translateX(2px); background: #171D25; }
.nav-item.active {
  color: var(--text);
  background: linear-gradient(90deg, rgba(225,6,0,.16), rgba(225,6,0,.035));
  box-shadow: inset 2px 0 0 var(--track);
}
.nav-item.active .nav-dot { background: var(--track) !important; box-shadow: 0 0 10px rgba(225,6,0,.55); }
#main { max-width: 1280px; padding-top: 30px; }
.page-title { font-family: var(--sans); font-weight: 750; letter-spacing: -.045em; }
.page-sub { color: var(--text-dim); }
.page.active { animation: ledger-page-in .28s cubic-bezier(.2,.75,.25,1) both; }
@keyframes ledger-page-in {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: translateY(0); }
}
.card {
  background: linear-gradient(145deg, rgba(20,25,33,.98), rgba(15,19,25,.98));
  border-color: var(--line-soft);
  border-radius: 12px;
  box-shadow: 0 8px 28px rgba(0,0,0,.12);
  transition: border-color .2s ease, transform .2s ease, box-shadow .2s ease;
}
.card:hover { border-color: #3A424D; box-shadow: 0 12px 34px rgba(0,0,0,.2); }
.section-head { border-bottom-color: var(--line-soft); }
.section-title { text-transform: uppercase; letter-spacing: .09em; font-size: 11px; font-weight: 750; }
.btn {
  border-radius: 8px;
  min-height: 36px;
  transition: transform .15s ease, filter .15s ease, background .15s ease, border-color .15s ease;
}
.btn:active { transform: scale(.97); }
.btn.primary {
  background: var(--track);
  border-color: var(--track);
  color: #fff;
  box-shadow: 0 4px 16px rgba(225,6,0,.18);
}
.btn.primary:hover { filter: brightness(1.12); }
input, select, textarea {
  background: #0B0F14;
  border-color: #303844;
  border-radius: 8px;
}
input:focus, select:focus, textarea:focus, button:focus-visible {
  outline-color: rgba(225,6,0,.8);
}
.pill { border-radius: 6px; }
.stat-num { font-family: var(--mono); font-weight: 700; letter-spacing: -.05em; }
.bar-track { background: #080B0F; height: 7px; border-radius: 99px; }
.bar-fill { border-radius: 99px; }
.modal-overlay { background: rgba(3,5,8,.82); backdrop-filter: blur(8px); }
.modal {
  background: #11161D;
  border-color: #343D48;
  border-radius: 14px;
  box-shadow: 0 24px 80px rgba(0,0,0,.5);
  animation: ledger-modal-in .2s ease both;
}
@keyframes ledger-modal-in {
  from { opacity: 0; transform: translateY(10px) scale(.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.toast { border-radius: 9px; border-left-color: var(--track); }
#tabbar { background: rgba(9,11,15,.92) !important; border-top-color: var(--line-soft) !important; }
#tabbar button.active { color: var(--text) !important; }
#tabbar button.active::before { background: var(--track) !important; box-shadow: 0 0 12px rgba(225,6,0,.45); }
#tabbar button { transition: color .18s ease, transform .18s ease; }
#tabbar button:active { transform: scale(.94); }
.sidebar-foot { letter-spacing: .04em; }
@media (max-width: 860px) {
  #main { padding: 16px 14px calc(96px + env(safe-area-inset-bottom)); }
  .page-title { font-size: 25px; }
  .card { border-radius: 11px; }
  .modal { max-height: calc(88vh - env(safe-area-inset-top)); }
}
@media (prefers-reduced-motion: reduce) {
  .page.active, .modal { animation: none !important; }
  .card, .btn, .nav-item, #tabbar button { transition: none !important; }
}

</style>

<div id="app">
  <nav id="sidebar">
    <div class="brand">Ledger <button class="close-btn" onclick="closeSidebar()">✕</button></div>
    <div class="nav-group" id="nav-list"></div>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </nav>
  <main id="main">
    <div class="topbar">
      <button class="hamburger" onclick="openSidebar()">☰ Menu</button>
      <strong id="topbar-title" style="font-family:var(--serif);font-size:18px;"></strong>

  </main>
</div>

<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-body"></div></div>
<div class="toast-wrap" id="toast-wrap"></div>
<script>
/* ============================================================
   LEDGER 2.0 — core: constants, db layer, utilities
   ============================================================ */
const DB_NAME = 'ledger_os';
const DB_VERSION = 1;
let db = null;

const STORES = [
  { name: 'habits', keyPath: 'id' },
  { name: 'habitLogs', keyPath: 'id' },
  { name: 'runs', keyPath: 'id' },
  { name: 'strengthSessions', keyPath: 'id' },
  { name: 'courses', keyPath: 'id' },
  { name: 'assignments', keyPath: 'id' },
  { name: 'studySessions', keyPath: 'id' },
  { name: 'languageLogs', keyPath: 'id' },
  { name: 'projects', keyPath: 'id' },
  { name: 'skills', keyPath: 'id' },
  { name: 'goals', keyPath: 'id' },
  { name: 'dailyReflections', keyPath: 'id' },
  { name: 'weeklyReviews', keyPath: 'id' },
  { name: 'recoveryLogs', keyPath: 'id' },
  { name: 'meta', keyPath: 'key' }
];

function openDatabase() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const _db = e.target.result;
      STORES.forEach(s => {
        if (!_db.objectStoreNames.contains(s.name)) {
          _db.createObjectStore(s.name, { keyPath: s.keyPath });
        }
      });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(db); };
    req.onerror = (e) => reject(e.target.error);
  });
}

function tx(storeName, mode = 'readonly') {
  return db.transaction(storeName, mode).objectStore(storeName);
}
function dbGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function dbGet(storeName, key) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
function dbPut(storeName, value) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName, 'readwrite').put(value);
    req.onsuccess = () => resolve(value);
    req.onerror = () => reject(req.error);
  });
}
function dbDelete(storeName, key) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName, 'readwrite').delete(key);
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}
function dbClear(storeName) {
  return new Promise((resolve, reject) => {
    const req = tx(storeName, 'readwrite').clear();
    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(req.error);
  });
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function todayISO(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function nowISO() { return new Date().toISOString(); }
function dayName(iso) {
  const names = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  return names[new Date(iso + 'T12:00:00').getDay()];
}
function shortDate(iso) {
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' +
    d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}
function daysBetween(a, b) {
  const A = new Date(a + 'T00:00:00'), B = new Date(b + 'T00:00:00');
  return Math.round((B - A) / 86400000);
}
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function round1(n) { return Math.round(n * 10) / 10; }
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg, isErr = false) {
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

async function toggleTodo(key, kind, id, iso) {
  if (kind === 'habit') {
    const logs = (await dbGetAll('habitLogs')).filter(l => l.habitId === id && l.date === iso);
    if (logs.length) { for (const l of logs) await dbDelete('habitLogs', l.id); }
    else await dbPut('habitLogs', { id: uid(), habitId: id, date: iso, level: 'min', createdAt: nowISO() });
  } else if (kind === 'task') {
    const list = await getMeta('tasks', []); const t = list.find(x => x.id === id); if (t) t.done = !t.done; await setMeta('tasks', list);
  } else if (kind === 'assign') {
    const a = await dbGet('assignments', id); a.status = 'done'; await dbPut('assignments', a); toast('Marked done.');
  } else {
    const arr = await getMeta('done-' + iso, []); const i = arr.indexOf(key);
    if (i >= 0) arr.splice(i, 1); else arr.push(key); await setMeta('done-' + iso, arr);
  }
}

async function computeDailyScore(iso) {
  const weights = await getWeights();
  const [habits, habitLogs, runs, strength, studySessions, languageLogs, projects, recoveryLogs] = await Promise.all([
    dbGetAll('habits'), dbGetAll('habitLogs'), dbGetAll('runs'), dbGetAll('strengthSessions'),
    dbGetAll('studySessions'), dbGetAll('languageLogs'), dbGetAll('projects'), dbGetAll('recoveryLogs')
  ]);
  const todayLogs = habitLogs.filter(l => l.date === iso);

  // each domain: 0-100 based on achievement-weighted activity for the day, not just checkbox count
  const academic = clamp(studySessions.filter(s => s.date === iso).reduce((sum, s) => sum + (s.type === 'output' ? 40 : s.type === 'practice' ? 22 : 10), 0), 0, 100);
  const physical = clamp((runs.some(r => r.date === iso) ? 55 : 0) + (strength.some(s => s.date === iso) ? 55 : 0), 0, 100);
  const languages = clamp(languageLogs.filter(l => l.date === iso).reduce((sum, l) => sum + (l.type === 'speaking' ? 35 : 20), 0), 0, 100);
  const professional = clamp(projects.filter(p => p.lastWorkedDate === iso).length * 50, 0, 100);
  const recovery = recoveryLogs.some(r => r.date === iso) ? 100 : 0;
  const dailyHabits = habits.filter(h => h.frequency === 'daily' && !h.archived);
  const discipline = dailyHabits.length ? clamp(Math.round((todayLogs.length / dailyHabits.length) * 100), 0, 100) : 0;

  const total =
    academic * weights.academic +
    physical * weights.physical +
    languages * weights.languages +
    professional * weights.professional +
    recovery * weights.recovery +
    discipline * weights.discipline;
  const maxPossible = Object.values(weights).reduce((a, b) => a + b, 0) * 100;
  return Math.round((total / maxPossible) * 100);
}

async function runningTabHtml() {
  const runs = (await dbGetAll('runs')).sort((a, b) => b.date.localeCompare(a.date));
  const weekDates = currentWeekDates();
  const weekRuns = runs.filter(r => weekDates.includes(r.date));
  const weekDist = weekRuns.reduce((s, r) => s + Number(r.distanceKm || 0), 0);
  const monthDist = runs.filter(r => r.date.slice(0, 7) === todayISO().slice(0, 7)).reduce((s, r) => s + Number(r.distanceKm || 0), 0);
  const pr = runs.reduce((best, r) => {
    if (!r.distanceKm || !r.durationMin) return best;
    const pace = r.durationMin / r.distanceKm;
    return (!best || pace < best.pace) ? { pace, run: r } : best;
  }, null);

  return `
    <div class="grid grid-4" style="margin-bottom:18px;">
      <div class="stat track"><div class="stat-num">${round1(weekDist)} km</div><div class="stat-label">this week</div></div>
      <div class="stat track"><div class="stat-num">${round1(monthDist)} km</div><div class="stat-label">this month</div></div>
      <div class="stat track"><div class="stat-num">${runs.length}</div><div class="stat-label">total runs logged</div></div>
      <div class="stat track"><div class="stat-num">${pr ? round1(pr.pace) + ' min/km' : '—'}</div><div class="stat-label">best pace (PR)</div></div>
    </div>
    <div class="row between" style="margin-bottom:12px;">
      <div class="section-title">Log</div>
      <button class="btn primary small" id="btn-add-run">+ Log a run</button>
    </div>
    ${runs.length ? `<div class="card">${runs.slice(0, 15).map(r => `
      <div class="list-item">
        <span>
          <span class="pill track">${r.sessionType || 'moderate'}</span>
          ${round1(r.distanceKm)} km in ${r.durationMin} min
          ${r.distanceKm && r.durationMin ? `<span class="faint mono">(${round1(r.durationMin / r.distanceKm)} min/km)</span>` : ''}
          ${r.notes ? `<div class="faint" style="font-size:12px;margin-top:2px;">${escapeHtml(r.notes)}</div>` : ''}
        </span>
        <span class="row" style="gap:8px;">
          <span class="faint mono">${shortDate(r.date)}</span>
          <button class="btn ghost small" data-del-run="${r.id}">✕</button>
        </span>
      </div>`).join('')}</div>` : `<div class="empty">No runs logged yet. You already run 5km+ comfortably — log one to start building the record.</div>`}
  `;
}

async function strengthTabHtml() {

      <button class="btn primary small" id="btn-add-strength">+ Log a session</button>

    ${sessions.length ? `<div class="card">${sessions.slice(0, 15).map(s => `
      <div class="list-item" style="align-items:flex-start;">

          <span class="pill track">${escapeHtml(s.dayLabel || s.workoutType)}</span>
          <div style="margin-top:4px;font-size:13px;">${(s.exercises || []).map(ex => `${escapeHtml(ex.name)} — ${ex.sets}×${ex.reps}${ex.load ? ' @ ' + escapeHtml(ex.load) : ''}${ex.pr ? ' <span class="pill amber">PR</span>' : ''}`).join('<br>')}</div>

function countPRs(sessions) {
  return sessions.reduce((n, s) => n + (s.exercises || []).filter(e => e.pr).length, 0);
}

async function recoveryTabHtml() {
  const logs = (await dbGetAll('recoveryLogs')).sort((a, b) => b.date.localeCompare(a.date));
  const last7 = logs.slice(0, 7);
  const avgSleep = last7.length ? round1(last7.reduce((s, l) => s + Number(l.sleepHours || 0), 0) / last7.length) : 0;
  const avgReadiness = last7.length ? round1(last7.reduce((s, l) => s + Number(l.readiness || 0), 0) / last7.length) : 0;

  // overload flag: 2+ hard sessions in a row with no recovery day logged between
  const [runs, strength] = await Promise.all([dbGetAll('runs'), dbGetAll('strengthSessions')]);
  const last3days = [todayISO(), todayISO(-1), todayISO(-2)];
  const hardSessions = last3days.filter(d =>
    runs.some(r => r.date === d && r.sessionType === 'hard') ||
    strength.some(s => s.date === d)
  ).length;
  const recentRecoveryLog = logs.some(l => last3days.includes(l.date) && Number(l.readiness) <= 2);
  const overloadFlag = hardSessions >= 3 || (hardSessions >= 2 && recentRecoveryLog);

  return `
    ${overloadFlag ? `<div class="card" style="border-color:var(--danger);margin-bottom:16px;">
        <strong style="color:var(--danger);font-size:13px;">Overload flag</strong>
        <p class="muted" style="font-size:13px;margin:6px 0 0;">Multiple hard sessions stacked with low readiness. Given sleep is often short for you, consider a lighter or full recovery day next.</p>
      </div>` : ''}
    <div class="grid grid-3" style="margin-bottom:18px;">
      <div class="stat violet"><div class="stat-num">${avgSleep || '—'}h</div><div class="stat-label">avg sleep (last 7 logs)</div></div>
      <div class="stat violet"><div class="stat-num">${avgReadiness || '—'}/5</div><div class="stat-label">avg readiness</div></div>
      <div class="stat violet"><div class="stat-num">${logs.length}</div><div class="stat-label">recovery logs total</div></div>
    </div>
    <div class="row between" style="margin-bottom:12px;">
      <div class="section-title">Log</div>
      <button class="btn primary small" id="btn-add-recovery">+ Log recovery</button>
    </div>
    ${logs.length ? `<div class="card">${logs.slice(0, 14).map(l => `
      <div class="list-item">
        <span>${l.sleepHours}h sleep · readiness ${l.readiness}/5 · session difficulty ${l.difficulty || '—'}/5
          ${l.notes ? `<div class="faint" style="font-size:12px;">${escapeHtml(l.notes)}</div>` : ''}
        </span>
        <span class="faint mono">${shortDate(l.date)}</span>
      </div>`).join('')}</div>` : `<div class="empty">No recovery logs yet. Since sleep tends to run short, this is the most important habit to keep consistent.</div>`}
  `;
}

function currentWeekDates() {
  const now = new Date();
  const jsDay = now.getDay();
  const mondayOffset = jsDay === 0 ? -6 : 1 - jsDay;
  const arr = [];
  for (let i = 0; i < 7; i++) arr.push(todayISO(mondayOffset + i));
  return arr;
}

function wireTrainingHandlers() {
  const addRun = document.getElementById('btn-add-run');

function computeStreakFromDates(dates) {
  const set = new Set(dates);
  let streak = 0;
  let cursor = todayISO();
  while (set.has(cursor)) {
    streak++;
    cursor = todayISO(-streak);
  }
  return streak;
}

// evidence thresholds to advance a level — deliberately not 1:1 with checkbox counts
const LEVEL_THRESHOLDS = [0, 3, 8, 16, 28, 45];

function levelFromEvidence(count) {
  let lvl = 1;
  for (let i = 1; i < LEVEL_THRESHOLDS.length; i++) {
    if (count >= LEVEL_THRESHOLDS[i]) lvl = i + 1;
  }
  return clamp(lvl, 1, LEVEL_THRESHOLDS.length);
}

async function bumpSkillEvidence(skillName) {
  const skills = await dbGetAll('skills');
  const skill = skills.find(s => s.name === skillName);
  if (!skill) return;
  skill.evidenceCount = (skill.evidenceCount || 0) + 1;
  skill.level = levelFromEvidence(skill.evidenceCount);
  skill.lastPracticed = todayISO();
  await dbPut('skills', skill);
}

              const prevThreshold = LEVEL_THRESHOLDS[s.level - 1] || 0;

            }).join('')}

async function collectActivityDates() {
  const stores = ['habitLogs', 'runs', 'strengthSessions', 'studySessions', 'languageLogs', 'recoveryLogs'];
  const all = await Promise.all(stores.map(s => dbGetAll(s)));
  const dates = {};
  all.flat().forEach(rec => {
    if (rec.date) dates[rec.date] = (dates[rec.date] || 0) + 1;
  });
  return dates;
}

function setupCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, w: rect.width, h: rect.height };
}

async function drawHeatmap() {
  const canvas = document.getElementById('heatmap-canvas');
  if (!canvas) return;
  const { ctx, w, h } = setupCanvas(canvas);
  const dates = await collectActivityDates();
  const weeks = 12;
  const cell = Math.min(14, (w - 20) / weeks);
  const gap = 3;
  const startOffset = -(weeks * 7 - 1);

  ctx.clearRect(0, 0, w, h);
  for (let week = 0; week < weeks; week++) {
    for (let d = 0; d < 7; d++) {
      const dayIndex = startOffset + week * 7 + d;
      const iso = todayISO(dayIndex);
      const count = dates[iso] || 0;
      const intensity = clamp(count / 4, 0, 1);
      ctx.fillStyle = count === 0 ? '#22252b' : mixColor('#123a2c', '#35c98d', intensity);
      const x = 10 + week * (cell + gap);
      const y = 10 + d * (cell + gap);
      roundRect(ctx, x, y, cell, cell, 2);
      ctx.fill();
    }
  }
}

function mixColor(c1, c2, t) {
  const p1 = hexToRgb(c1), p2 = hexToRgb(c2);
  const r = Math.round(p1.r + (p2.r - p1.r) * t);
  const g = Math.round(p1.g + (p2.g - p1.g) * t);
  const b = Math.round(p1.b + (p2.b - p1.b) * t);
  return `rgb(${r},${g},${b})`;
}
function hexToRgb(hex) {
  const n = parseInt(hex.replace('#', ''), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

async function drawScoreLine() {
  const canvas = document.getElementById('score-canvas');
  if (!canvas) return;
  const { ctx, w, h } = setupCanvas(canvas);
  const days = [];
  for (let i = -13; i <= 0; i++) days.push(todayISO(i));
  const scores = [];
  for (const d of days) scores.push(await computeDailyScore(d));

  ctx.clearRect(0, 0, w, h);
  const pad = 24;
  const maxY = 100;
  const stepX = (w - pad * 2) / (days.length - 1);

  // gridlines
  ctx.strokeStyle = '#22252b';
  ctx.lineWidth = 1;
  [0, 25, 50, 75, 100].forEach(v => {
    const y = h - pad - (v / maxY) * (h - pad * 2);
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w - pad, y); ctx.stroke();
  });

  ctx.strokeStyle = '#6d8bff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  scores.forEach((s, i) => {
    const x = pad + i * stepX;
    const y = h - pad - (s / maxY) * (h - pad * 2);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();

  ctx.fillStyle = '#6d8bff';
  scores.forEach((s, i) => {
    const x = pad + i * stepX;
    const y = h - pad - (s / maxY) * (h - pad * 2);
    ctx.beginPath(); ctx.arc(x, y, 2.5, 0, Math.PI * 2); ctx.fill();
  });
}

async function drawRunBars() {
  const canvas = document.getElementById('run-canvas');
  if (!canvas) return;
  const { ctx, w, h } = setupCanvas(canvas);
  const runs = await dbGetAll('runs');
  const weeks = [];
  const now = new Date();
  const jsDay = now.getDay();
  const mondayOffset = jsDay === 0 ? -6 : 1 - jsDay;
  for (let i = 7; i >= 0; i--) {
    const weekStart = mondayOffset - i * 7;
    const dates = [];
    for (let d = 0; d < 7; d++) dates.push(todayISO(weekStart + d));
    const dist = runs.filter(r => dates.includes(r.date)).reduce((s, r) => s + Number(r.distanceKm || 0), 0);
    weeks.push(dist);
  }
  const maxDist = Math.max(5, ...weeks);
  ctx.clearRect(0, 0, w, h);
  const pad = 24;
  const barW = (w - pad * 2) / weeks.length * 0.6;
  const gap = (w - pad * 2) / weeks.length;
  weeks.forEach((dist, i) => {
    const barH = (dist / maxDist) * (h - pad * 2);
    const x = pad + i * gap + (gap - barW) / 2;
    const y = h - pad - barH;
    ctx.fillStyle = '#ff5d2e';
    roundRect(ctx, x, y, barW, barH, 2);
    ctx.fill();
  });
}

      openModal(`

      `);
      document.getElementById('confirm-import').addEventListener('click', async () => {
        for (const s of STORES) {
          if (Array.isArray(data[s.name])) {
            for (const rec of data[s.name]) await dbPut(s.name, rec);

        }
        closeModal(); toast('Import complete.'); goTo(currentPage);

async function scheduleNative(){
  try{

  if(NATIVE){try{await LN().schedule({notifications:[{id:9999,title,body,schedule:{at:new Date(Date.now()+2000)}}]});return true;}catch(e){return false;}}
  if(!('Notification' in window)||Notification.permission!=='granted')return false;
  try{

    if(reg)await reg.showNotification(title,{body,tag,icon:'icon-192.png',badge:'icon-192.png',data:{url:'./#today'}});

async function checkReminders(){
  if(NATIVE)return;
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const rec=await loadRem(),now=new Date(),iso=todayISO(),mins=now.getHours()*60+now.getMinutes();
  rec.fired=rec.fired||{};let ch=false;
  for(const it of rec.items){
    if(!it.on||!it.days.includes(now.getDay())||rec.fired[it.id]===iso)continue;
    const[h,m]=it.time.split(':').map(Number),t=h*60+m;
    if(mins>=t&&mins-t<=90){
      let body=it.body;
      if(it.id==='night'){const n=await habitsLeft();if(n>0)body+=` ${n} daily habit${n>1?'s':''} still open.`;}
      if(await fireNote(it.label,body,it.id)){rec.fired[it.id]=iso;ch=true;}
    }
  }
  if(ch)await dbPut('meta',rec);
}

  const ios=/iphone|ipad/i.test(navigator.userAgent),standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const days=['Su','Mo','Tu','We','Th','Fr','Sa'];
  const html=`<div class="section" id="rem-card"><div class="section-head"><div class="section-title">Reminders &amp; phone app</div></div><div class="card">
    <p class="muted" style="font-size:13px;margin:0 0 12px;">${perm==='granted'?'Notifications are on.':perm==='denied'?'Notifications are blocked. Enable them in your browser or phone settings for this app.':perm==='unsupported'?'This browser does not support notifications.':'Turn on notifications to get your reminders.'}
    ${ios&&!standalone?' On iPhone: tap Share, then Add to Home Screen, then open Ledger from the home screen. Notifications only work from there.':''}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
      ${perm==='default'?'<button class="btn primary small" id="rem-perm">Enable notifications</button>':''}
      ${perm==='granted'?'<button class="btn small" id="rem-test">Send test</button>':''}
      ${_installEv?'<button class="btn small" id="rem-install">Install app</button>':''}
    </div>
    ${rec.items.map(it=>`<div class="rem-row"><input type="checkbox" data-rem-on="${it.id}" ${it.on?'checked':''}>
      <div><input data-rem-label="${it.id}" value="${escapeHtml(it.label)}" style="width:100%;"><div class="faint" style="font-size:12px;">${it.days.length===7?'Every day':it.days.map(d=>days[d]).join(' ')}</div></div>
      <input type="time" data-rem-time="${it.id}" value="${it.time}"><button class="btn ghost small" data-rem-del="${it.id}">✕</button></div>`).join('')}
    <button class="btn small" id="rem-add" style="margin-top:10px;">+ Add reminder</button>
    <p class="faint" style="font-size:12px;margin:10px 0 0;">${NATIVE?'Reminders are scheduled on your phone and fire even when the app is closed.':'Reminders fire when Ledger is open or was recently used. For the most reliable alerts, install it and keep notifications allowed.'}</p>
  </div></div>`;
  if(c.querySelector('#rem-card'))return;
  const head=c.querySelector('.page-head');
  head?head.insertAdjacentHTML('afterend',html):c.insertAdjacentHTML('afterbegin',html);
  const q=s=>c.querySelector(s);
  q('#rem-perm')&&q('#rem-perm').addEventListener('click',async()=>{if(NATIVE){await LN().requestPermissions();await scheduleNative();}else await Notification.requestPermission();c.querySelector('#rem-card').remove();addReminderCard();checkReminders();});
  q('#rem-test')&&q('#rem-test').addEventListener('click',()=>fireNote('Ledger','Notifications work. Now go do the first thing.','test'));
  q('#rem-install')&&q('#rem-install').addEventListener('click',async()=>{_installEv.prompt();await _installEv.userChoice;_installEv=null;c.querySelector('#rem-card').remove();addReminderCard();});
  c.querySelectorAll('[data-rem-on]').forEach(el=>el.addEventListener('change',async()=>{const r=await loadRem();r.items.find(i=>i.id===el.dataset.remOn).on=el.checked;await dbPut('meta',r);if(NATIVE)scheduleNative();toast('Saved');}));
  c.querySelectorAll('[data-rem-time]').forEach(el=>el.addEventListener('change',async()=>{const r=await loadRem();const it=r.items.find(i=>i.id===el.dataset.remTime);it.time=el.value;delete r.fired[it.id];await dbPut('meta',r);if(NATIVE)scheduleNative();toast('Saved');}));
  const redo = async () => { const x = c.querySelector('#rem-card'); if (x) x.remove(); await addReminderCard(); if (NATIVE) scheduleNative(); };
  c.querySelectorAll('[data-rem-label]').forEach(el => el.addEventListener('change', async () => { const r = await loadRem(); r.items.find(i => i.id === el.dataset.remLabel).label = el.value || 'Reminder'; await dbPut('meta', r); if (NATIVE) scheduleNative(); toast('Saved'); }));
  c.querySelectorAll('[data-rem-del]').forEach(el => el.addEventListener('click', async () => { const r = await loadRem(); r.items = r.items.filter(i => i.id !== el.dataset.remDel); await dbPut('meta', r); redo(); }));
  const addR = c.querySelector('#rem-add'); if (addR) addR.addEventListener('click', async () => { const r = await loadRem(); r.items.push({ id: uid(), label: 'New reminder', time: '09:00', days: [0,1,2,3,4,5,6], on: true, body: 'Time to check in with your plan.' }); await dbPut('meta', r); redo(); });
}
const _rsOrig=PAGE_RENDERERS.settings;
PAGE_RENDERERS.settings=async()=>{await _rsOrig();await addReminderCard();await addSettingsExtras();};

async function startPhoneLayer(){
  if(NATIVE){if(await nativePerm()==='granted')scheduleNative();return;}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
    try{
      const reg=await navigator.serviceWorker.register('sw.js');
      const ready=await navigator.serviceWorker.ready;
      if(ready.periodicSync){try{await ready.periodicSync.register('ledger-reminders',{minInterval:3600000});}catch(e){}}
    }catch(e){}
  }
  checkReminders();
  setInterval(checkReminders,30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders();});
}


/* ============================================================
   LEDGER — make it yours: plan, schedule, program, prompts, habits
   ============================================================ */
const TRAIN_OPTS = { gym: 'Gym / strength', run: 'Run', long_run: 'Long run', recovery: 'Recovery / mobility', rest: 'Rest', other: 'Other activity' };
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const optHtml = (o, sel) => Object.entries(o).map(([k, v]) => `<option value="${k}" ${k === sel ? 'selected' : ''}>${v}</option>`).join('');

async function loadCustomizations() {
  const plan = await getMeta('plan', null); if (plan) Object.assign(DAY_PLAN, plan);
  const sp = await getMeta('split', null);
  if (sp && Object.keys(sp).length) { Object.keys(STRENGTH_SPLIT).forEach(k => delete STRENGTH_SPLIT[k]); Object.assign(STRENGTH_SPLIT, sp); }
}

function openHabitEdit(h) {
  const cats = ['academic', 'physical', 'languages', 'professional', 'recovery'];
  openModal(`<h3>Edit habit</h3>
    <div class="field"><label>Name</label><input id="eh-name" value="${escapeHtml(h.name)}"></div>
    <div class="row">
      <div class="field" style="flex:1;"><label>Category</label><select id="eh-cat">${cats.map(c => `<option value="${c}" ${h.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
      <div class="field" style="flex:1;"><label>Frequency</label><select id="eh-freq"><option value="daily" ${h.frequency === 'daily' ? 'selected' : ''}>Daily</option><option value="weekly" ${h.frequency === 'weekly' ? 'selected' : ''}>Weekly</option></select></div>
    </div>
    <div class="row">
      <div class="field" style="flex:1;"><label>Minimum viable</label><input id="eh-min" value="${escapeHtml(h.minViable || '')}"></div>
      <div class="field" style="flex:1;"><label>Ideal version</label><input id="eh-ideal" value="${escapeHtml(h.idealVersion || '')}"></div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:8px;"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" id="eh-save">Save</button></div>`);
  document.getElementById('eh-save').addEventListener('click', async () => {
    const name = document.getElementById('eh-name').value.trim(); if (!name) { toast('Enter a name.', true); return; }
    Object.assign(h, { name, category: document.getElementById('eh-cat').value, frequency: document.getElementById('eh-freq').value, minViable: document.getElementById('eh-min').value, idealVersion: document.getElementById('eh-ideal').value, target: document.getElementById('eh-ideal').value });
    await dbPut('habits', h); closeModal(); toast('Saved.'); renderSettings().then(() => addSettingsExtras());
  });
}

async function addSettingsExtras() {
  const c = document.getElementById('page-settings'); if (!c || c.querySelector('#setup-card')) return;
  const [user, events, P, habits] = await Promise.all([getMeta('user', ''), getMeta('events', []), getPrompts(), dbGetAll('habits')]);
  if (c.querySelector('#setup-card')) return;
  const evs = events.slice().sort((a, b) => DAYS.indexOf(a.day) - DAYS.indexOf(b.day) || (a.time || '').localeCompare(b.time || ''));
  const html = `<div id="setup-card">
    <div class="section"><div class="section-head"><div class="section-title">Your name</div></div><div class="card"><div class="row"><input id="set-name" value="${escapeHtml(user)}" placeholder="Your name" style="flex:1;"><button class="btn primary small" id="save-name">Save</button></div></div></div>
    <div class="section"><div class="section-head"><div class="section-title">Weekly plan</div></div><div class="card">
      <p class="muted" style="font-size:13px;margin:0 0 6px;">What you plan to do each day. Change it any time.</p>
      ${DAYS.map(d => `<div class="plan-row"><strong>${d}</strong>
        <select data-plan-train="${d}">${optHtml(TRAIN_OPTS, DAY_PLAN[d].training)}</select>
        <select data-plan-int="${d}">${optHtml({ light: 'Light', moderate: 'Moderate', hard: 'Hard' }, DAY_PLAN[d].intensity)}</select>
        <input class="note" data-plan-note="${d}" value="${escapeHtml(DAY_PLAN[d].note)}" placeholder="Note for the day"></div>`).join('')}
      <button class="btn primary small" id="save-plan" style="margin-top:10px;">Save plan</button></div></div>
    <div class="section"><div class="section-head"><div class="section-title">Weekly schedule <span class="n">(${events.length})</span></div></div><div class="card">
      <p class="muted" style="font-size:13px;margin:0 0 8px;">Work, classes, practice, anything with a time. Shows on Today and This Week.</p>
      ${evs.map(e => `<div class="list-item"><span><span class="pill ink">${e.day.slice(0, 3)}</span> ${escapeHtml(e.time || '')} ${escapeHtml(e.title)}</span><button class="btn ghost small" data-del-event="${e.id}">✕</button></div>`).join('')}
      <div class="plan-row" style="border:0;"><select id="ev-day">${DAYS.map(d => `<option>${d}</option>`).join('')}</select><input id="ev-time" type="time"><input class="note" id="ev-title" placeholder="What is it? e.g. Work shift"></div>
      <button class="btn small" id="add-event">+ Add to schedule</button></div></div>
    <div class="section"><div class="section-head"><div class="section-title">Strength program</div></div><div class="card">
      <p class="muted" style="font-size:13px;margin:0 0 8px;">Up to four workouts. One exercise per line. Leave a name empty to remove it.</p>
      ${['A', 'B', 'C', 'D'].map(k => `<div class="field"><label>Workout ${k}</label><input data-split-label="${k}" value="${escapeHtml(STRENGTH_SPLIT[k] ? STRENGTH_SPLIT[k].label : '')}" placeholder="Name, e.g. Upper body"><textarea data-split-ex="${k}" placeholder="Exercises, one per line">${escapeHtml(STRENGTH_SPLIT[k] ? STRENGTH_SPLIT[k].exercises.join('\n') : '')}</textarea></div>`).join('')}
      <button class="btn primary small" id="save-split">Save program</button></div></div>
    <div class="section"><div class="section-head"><div class="section-title">Reflection questions</div></div><div class="card">
      ${P.map((q, i) => `<div class="field"><label>Question ${i + 1}</label><input data-prompt="${i}" value="${escapeHtml(q)}"></div>`).join('')}
      <button class="btn primary small" id="save-prompts">Save questions</button></div></div></div>`;
  const anchor = c.querySelector('#rem-card');
  if (anchor) anchor.insertAdjacentHTML('afterend', html); else c.insertAdjacentHTML('afterbegin', html);
  const q = s => c.querySelector(s), again = () => renderSettings().then(() => { return PAGE_RENDERERS.settings ? addReminderCard().then(addSettingsExtras) : 0; });

  q('#save-name').addEventListener('click', async () => { await setMeta('user', q('#set-name').value.trim()); toast('Saved'); });
  q('#save-plan').addEventListener('click', async () => {
    DAYS.forEach(d => { DAY_PLAN[d] = { training: q(`[data-plan-train="${d}"]`).value, intensity: q(`[data-plan-int="${d}"]`).value, note: q(`[data-plan-note="${d}"]`).value }; });
    await setMeta('plan', DAY_PLAN); toast('Plan saved');
  });
  q('#add-event').addEventListener('click', async () => {
    const title = q('#ev-title').value.trim(); if (!title) { toast('Enter what it is.', true); return; }
    const list = await getMeta('events', []); list.push({ id: uid(), day: q('#ev-day').value, time: q('#ev-time').value, title });
    await setMeta('events', list); again();
  });
  c.querySelectorAll('[data-del-event]').forEach(b => b.addEventListener('click', async () => { await setMeta('events', (await getMeta('events', [])).filter(e => e.id !== b.dataset.delEvent)); again(); }));
  q('#save-split').addEventListener('click', async () => {
    const sp = {};
    ['A', 'B', 'C', 'D'].forEach(k => { const label = q(`[data-split-label="${k}"]`).value.trim(); if (label) sp[k] = { label, exercises: q(`[data-split-ex="${k}"]`).value.split('\n').map(x => x.trim()).filter(Boolean) }; });
    if (!Object.keys(sp).length) { toast('Keep at least one workout.', true); return; }
    Object.keys(STRENGTH_SPLIT).forEach(k => delete STRENGTH_SPLIT[k]); Object.assign(STRENGTH_SPLIT, sp);
    await setMeta('split', sp); toast('Program saved');
  });
  q('#save-prompts').addEventListener('click', async () => { await setMeta('prompts', [...c.querySelectorAll('[data-prompt]')].map(i => i.value.trim() || 'Question')); toast('Saved'); });

  c.querySelectorAll('[data-archive-habit]').forEach(b => {
    if (b.parentNode.dataset && b.parentNode.dataset.habitWrap) return;
    const w = document.createElement('span'); w.className = 'row'; w.style.gap = '6px'; w.dataset.habitWrap = '1';
    const e = document.createElement('button'); e.className = 'btn ghost small'; e.textContent = 'Edit';
    e.addEventListener('click', () => openHabitEdit(habits.find(h => h.id === b.dataset.archiveHabit)));
    b.parentNode.insertBefore(w, b); w.appendChild(e); w.appendChild(b);
  });
}

function startClock() {
  const tick = () => {
    document.querySelectorAll('#live-clock').forEach(e => e.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
    if (window.__day && window.__day !== todayISO() && currentPage === 'today') renderToday();
  };
  tick(); setInterval(tick, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
}

async function maybeWelcome() {
  if ((await getMeta('user', null)) !== null) return;
  openModal(`<h3>Welcome to Ledger</h3>
    <p class="muted" style="font-size:13px;margin:0 0 12px;">Your personal system for the things you choose to track. Start with your own activities and schedule — nothing is preselected, and you can shape Ledger whenever you need.</p>
    <div class="field"><label>What should I call you?</label><input id="wl-name" placeholder="Your name"></div>
    <div class="row" style="justify-content:flex-end;margin-top:8px;"><button class="btn primary" id="wl-go">Get started</button></div>`);
  document.getElementById('wl-go').addEventListener('click', async () => { await setMeta('user', document.getElementById('wl-name').value.trim()); closeModal(); if (currentPage === 'today') renderToday(); });
}

boot().then(() => { startPhoneLayer(); startClock(); maybeWelcome(); });
